# 갤럭시 등 안드로이드 시험용 APK를 만든다(플레이스토어용 아님, 디버그 서명).
# main에 올릴 때마다 자동으로 돌고, 결과 APK는 Releases의 "android-latest"에 덮어쓴다.
name: Android APK

on:
  push:
    branches: [main]
    paths-ignore: ['**.md', 'server/**', 'ios/**']
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: android-apk
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 21
      - uses: gradle/actions/setup-gradle@v4
      # 디버그 서명 키를 계속 같은 것으로 써야 새 APK를 기존 앱 위에 덮어 깔 수 있다(키가 바뀌면 지우고 다시 깔아야 함)
      - name: Restore debug keystore
        uses: actions/cache@v4
        with:
          path: ~/.android/debug.keystore
          key: debug-keystore-v1
      - run: npm ci
      - run: npm run build
      - run: npx cap sync android
      - name: Build APK
        working-directory: android
        run: |
          chmod +x gradlew
          ./gradlew assembleDebug --no-daemon
      - name: Name the APK
        run: |
          mkdir -p out
          cp android/app/build/outputs/apk/debug/app-debug.apk "out/sangokurtd-test.apk"
          ls -la out
      - uses: actions/upload-artifact@v4
        with:
          name: sangokurtd-test-apk
          path: out/sangokurtd-test.apk
      - name: Publish to Releases (android-latest)
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release delete android-latest --yes --cleanup-tag || true
          gh release create android-latest out/sangokurtd-test.apk \
            --title "Android 시험용 APK (최신)" \
            --notes "커밋 ${GITHUB_SHA::7} 기준 자동 빌드. 디버그 서명이라 플레이스토어에는 올릴 수 없습니다." \
            --prerelease --target "$GITHUB_SHA"
