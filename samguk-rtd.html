<style>
/* 레이아웃: 고정 군막 화면. 왼쪽 타이머·명령, 가운데 게임판·정보·조합식, 오른쪽 탭. 패널은 스크롤 없이 한 화면에 들어온다. */
:root {

* { box-sizing: border-box; }
html, body { height: 100%; overflow: hidden; }
body { background: var(--ink); color: var(--paper); font: 13px/1.45 var(--ui); user-select: none; -webkit-user-select: none; overscroll-behavior: none; }
button, input { font: inherit; color: inherit; }

:focus-visible { outline: 2px solid var(--brass); outline-offset: 1px; }

html, body, * { -webkit-tap-highlight-color: transparent; }
:focus:not(:focus-visible) { outline: none; }
#app { position: fixed; inset: env(safe-area-inset-top, 0px) 0 env(safe-area-inset-bottom, 0px) 0; display: grid; grid-template: 0 minmax(0, 1fr) 0 196px / 250px minmax(0, 1fr) 270px; padding-left: env(safe-area-inset-left, 0px); padding-right: env(safe-area-inset-right, 0px); }
#top { grid-column: 1 / 4; display: none; align-items: center; gap: 16px; padding: 0 12px; background: var(--lacquer); border-bottom: 1px solid var(--line); white-space: nowrap; overflow: hidden; font-variant-numeric: tabular-nums; }

@keyframes hop { 0%, 100% { transform: translateY(1px); } 50% { transform: translateY(-2px); } }

#startbtn:hover:not(:disabled) { filter: brightness(1.12); }
#startbtn:disabled { filter: grayscale(.7) brightness(.7); box-shadow: none; }
#roster { font-size: 12px; color: var(--dim); margin-top: 6px; }
/* 시작 화면: 묶음마다 얇은 테두리, 난이도 카드는 색으로 구분 */

#setup .hint { font: 400 11px var(--ui); color: var(--dim); margin-left: 6px; }

.choice.diffs button.on { background: linear-gradient(180deg, color-mix(in srgb, var(--dc) 28%, #2b1f15), #2b1f15); box-shadow: 0 0 12px color-mix(in srgb, var(--dc) 40%, transparent); border-color: var(--dc); }
.choice.modes button { font: 700 14px var(--ui); padding: 10px 4px; }
.mutlv { display: flex; gap: 6px; flex-wrap: wrap; }

.mutlv .reroll { margin-left: auto; font: 700 12px var(--ui); }
#mutrules { display: grid; gap: 5px; margin-top: 8px; }
.mut { display: grid; grid-template-columns: 22px 1fr; gap: 2px 8px; padding: 6px 8px; background: rgba(0,0,0,.25); border-left: 3px solid #c99a2e; font-size: 12px; }

.mut b { font: 700 13px var(--serif); color: #f4ecd8; }
.mut .gb { display: flex; flex-wrap: wrap; gap: 4px 12px; } .mut .g { color: #9be89a; } .mut .bd { color: #ff8a70; }
/* 로비: 방 코드와 다섯 자리 */

.lb-slot { position: relative; min-height: 74px; padding: 8px 4px 6px; display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 4px; background: var(--panel); border: 1px solid var(--line); font-size: 12px; text-align: center; }
.lb-slot.in { border-color: #c99a2e; background: linear-gradient(180deg, rgba(201,154,46,.18), var(--panel)); animation: lbjoin .45s ease-out; }
.lb-slot .host { top: 2px; right: 4px; font-size: 11px; }
.lb-slot.me { border-color: #7dff8e; }
.lb-slot .av { width: 32px; height: 32px; display: grid; place-items: center; border-radius: 50%; background: #3a2a1c; font: 400 17px "Black Han Sans", sans-serif; color: #ffe2a8; }
.lb-slot.empty { color: var(--dim); border-style: dashed; }
.lb-slot .host { position: absolute; top: 3px; right: 5px; color: #ffd86a; font-size: 12px; }
.lb-cfg { margin-top: 8px; font-size: 12px; color: var(--paper); }

#hero .tagline { display: flex; gap: 8px; margin-top: 12px; flex-wrap: wrap; }
#hero .tagline span { padding: 3px 9px; border: 1px solid rgba(230, 197, 120, .45); background: rgba(20, 14, 10, .55); font: 700 12px var(--ui); color: #e6c578; }
.keys { color: var(--dim); font-size: 12px; line-height: 1.7; }
.keys kbd { font: 700 11px var(--ui); color: var(--brass); }
#end .sheet { align-items: center; text-align: center; width: min(460px, 100%); }
/* 판 끝 통계 */

#end .es h2 { text-align: center; font-size: 34px; }
#end .es > .dim { text-align: center; color: var(--dim); }
#end .es h3 { margin: 10px 0 2px; font: 700 15px "Gowun Batang", serif; color: var(--brass); border-bottom: 1px solid var(--line); padding-bottom: 3px; }
.es-cards { display: grid; grid-template-columns: repeat(5, minmax(0, 1fr)); gap: 6px; }
.es-cards .es-card { min-width: 0; overflow: hidden; }
.es-cards .es-card b { overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
@media (max-width: 760px) { .es-cards { gap: 4px; } .es-cards .es-card { padding: 4px 6px; } .es-cards .es-card b { font-size: 16px; } .es-cards .es-card small, .es-cards .es-card i { font-size: 10px; } }
@media (max-height: 520px) { .es-lose { width: 130px; margin: -4px 0 -10px; } .es-lose span { font-size: 15px; } .es-win { height: 42px; width: min(240px, 60%); } .es-win span { font-size: 22px; } }
/* 다시 출정 버튼은 스크롤해도 아래에 붙어 있다 */
#end .es-again { position: sticky; bottom: 0; z-index: 2; flex: none; }
/* 난이도 칸 */

#end .es-card.es-diff b { color: var(--dc); }
#end .es-card.es-diff.has-mut { cursor: pointer; }
.es-bang { position: absolute; top: 5px; right: 6px; width: 18px; height: 18px; border-radius: 50%; background: var(--dc); color: #1a0f08; font: 800 13px/18px "IBM Plex Sans KR", sans-serif; font-style: normal; text-align: center; box-shadow: 0 0 6px var(--dc); }
#end .es-mutpop { position: fixed; z-index: 70; left: 50%; top: 50%; transform: translate(-50%, -50%); width: min(420px, 90vw); max-height: 80vh; overflow-y: auto; display: grid; gap: 4px; padding: 12px; background: #1d120c; border: 2px solid #ff5a5a; border-radius: 10px; box-shadow: 0 10px 30px rgba(0,0,0,.7); }
#end .es-mutpop[hidden] { display: none; }
#end .es-mutpop > b { font: 400 18px "Black Han Sans", sans-serif; color: #ff8a7a; margin-bottom: 4px; }
.es-card { background: var(--panel); border: 1px solid var(--line); padding: 6px 9px; display: flex; flex-direction: column; }
/* ---- 결과창: 철괴 창 · 승리 제목판 · 패배 나무판 · 다시 출정 ---- */
#end .sheet.es { background: none; border-style: solid; border-width: 20px; border-image: url(gfx/ui_frame.png) 20 fill stretch; padding: 4px 10px 10px; filter: drop-shadow(0 10px 24px rgba(0,0,0,.6)); }
.es-win { align-self: center; width: min(320px, 70%); height: 56px; flex: none; display: flex; align-items: center; justify-content: center; background: url(gfx/ui_title.png) center/100% 100% no-repeat; margin: 2px 0 4px; }
.es-win span { font: 400 30px "Black Han Sans", sans-serif; color: #ffd86a; text-shadow: 0 2px 4px #000, 0 0 16px rgba(255,190,80,.6); letter-spacing: .06em; }
.es-lose { position: relative; align-self: center; width: min(200px, 46%); aspect-ratio: 640 / 355; background: url(gfx/defeat_plank.png) center/contain no-repeat; margin: 0 0 -6px; flex: none; }
/* 글씨는 나무판(그림 오른쪽 70%) 가운데에, 판의 기울기에 맞춰 */
.es-lose span { position: absolute; left: 30%; right: 6%; top: 36%; text-align: center; font: 400 21px "Black Han Sans", sans-serif; color: #f4e6cc; text-shadow: 0 2px 2px #1a0f08, 0 0 6px rgba(0,0,0,.7); transform: rotate(-9deg); white-space: nowrap; }
#end .es-cards .es-card { border: 1px solid #a8742a; border-radius: 8px; background: linear-gradient(180deg, #3a1d18 0%, #22100d 100%); box-shadow: inset 0 1px 0 rgba(255,220,180,.10), 0 2px 6px rgba(0,0,0,.5); }
#end .es-card small { color: #c9a98f; } #end .es-card b { color: #ffd77a; } #end .es-card i { color: #b89c86; }
#end .es-again { align-self: center; min-width: 240px; height: 76px; margin-top: 12px; padding: 0; background: none; border-radius: 0; box-shadow: none; border-style: solid; border-width: 24px 30px; border-image: url(gfx/ui_battle.png) 38 fill stretch; font: 400 22px "Black Han Sans", sans-serif; color: #ffe6b0; text-shadow: 0 2px 4px #000, 0 0 12px rgba(255,140,40,.6); }
/* ---- 판 끝 경험치 연출 ---- */
.over.xpwait { background: rgba(8, 5, 3, .55); backdrop-filter: blur(4px); -webkit-backdrop-filter: blur(4px); }
#xpfx { position: absolute; inset: 0; z-index: 60; display: flex; align-items: center; justify-content: center; background: rgba(6, 4, 2, .62); backdrop-filter: blur(6px); -webkit-backdrop-filter: blur(6px); opacity: 0; transition: opacity .5s; pointer-events: none; }
#xpfx.in { opacity: 1; } #xpfx.out { opacity: 0; }
#xpfx .xpbox { display: grid; grid-template-columns: 110px minmax(0, 1fr) 110px; align-items: center; gap: 14px; width: min(720px, 92%); }
#xpfx .xpside { display: flex; flex-direction: column; align-items: center; gap: 4px; color: #e8dcc0; font: 700 13px var(--ui); text-shadow: 0 1px 2px #000; }
#xpfx .xpm { width: 84px; height: 84px; display: flex; align-items: center; justify-content: center; }
#xpfx .xpm img { max-width: 100%; max-height: 100%; filter: drop-shadow(0 4px 8px rgba(0,0,0,.7)); }
#xpfx .xpm b { font: 400 34px "Black Han Sans", sans-serif; color: #ffd86a; }
#xpfx .r .xpm { opacity: .55; filter: grayscale(.6); }
#xpfx.up .l .xpm { animation: xpup .6s ease-out; }
@keyframes xpup { 0% { transform: scale(1.6); filter: brightness(2.2); } 100% { transform: scale(1); filter: none; } }
#xpfx .xpmid { position: relative; display: flex; flex-direction: column; align-items: center; gap: 6px; }
#xpfx .xpbar { width: 100%; height: 22px; border-style: solid; border-width: 6px 8px; border-image: url(gfx/ui_menu.png) 12 fill stretch; position: relative; }
#xpfx .xpbar i { position: absolute; left: 0; top: 0; bottom: 0; width: 0; background: linear-gradient(180deg, #ffe08a, #d89a2a 60%, #a8661a); box-shadow: 0 0 10px rgba(255,190,80,.7); border-radius: 2px; }
#xpfx .xpnum { font: 700 12px var(--ui); color: #d8cbb0; font-variant-numeric: tabular-nums; }
#xpfx .xpgain { position: absolute; top: -46px; font: 400 32px "Black Han Sans", sans-serif; color: #ffe08a; text-shadow: 0 2px 4px #000, 0 0 14px rgba(255,190,80,.8); opacity: 0; transform: translateY(10px) scale(.8); transition: opacity .35s, transform .35s; }
#xpfx .xpcoin { font: 700 15px var(--ui); color: #ffd86a; opacity: 0; transition: opacity .35s .2s; }
#xpfx.gain .xpgain { opacity: 1; transform: none; } #xpfx.gain .xpcoin { opacity: 1; }
.es-card small { color: var(--dim); font-size: 11px; }
.es-card b { font: 400 20px "Black Han Sans", sans-serif; color: #f4ecd8; }
.es-card i { font-style: normal; font-size: 11px; color: var(--dim); }
.es-boss { width: 100%; border-collapse: collapse; font-size: 12px; }
.es-boss th { text-align: left; color: var(--dim); font-weight: 500; padding: 3px 6px; }
.es-boss td { padding: 4px 6px; border-top: 1px solid var(--line); vertical-align: top; }
.es-boss td.ok { color: #9be89a; } .es-boss td.bad { color: #ff7a60; }
.es-rks { display: flex; flex-wrap: wrap; gap: 3px 10px; }
.es-rk em { font-style: normal; color: var(--dim); } .es-rk.me { color: #9be89a; }
.es-bar { display: grid; grid-template-columns: 170px 1fr 150px; align-items: center; gap: 8px; font-size: 12px; margin: 2px 0; }
.es-bar .b { height: 10px; background: rgba(255,255,255,.06); } .es-bar .b i { display: block; height: 100%; }
.es-bar .v { text-align: right; color: var(--dim); }
@media (max-width: 640px) { .es-bar { grid-template-columns: 110px 1fr 100px; } .es-boss td:nth-child(4) { display: none; } }
/* 세로로 긴 화면만 쌓아서 보여준다. 나머지 해상도는 ui.js가 화면 전체 배율로 맞춘다. */
@media (max-width: 900px) and (orientation: portrait) {
  #title { grid-template-columns: minmax(0, 1fr); }
  #setup { padding-left: max(16px, env(safe-area-inset-left, 0px)); justify-content: flex-start; }
  .choice { grid-template-columns: repeat(2, 1fr); }
}
@media (prefers-reduced-motion: reduce) { .toast { animation-duration: 3.6s; } #hired img { animation: none; } }
/* ===== 모바일 우선 배치: 맵을 화면 전체로, 패널은 서랍·게임 내 버튼으로 ===== */
#app { display: block; grid-template: none; padding: 0; inset: 0; }
#stage { position: absolute; inset: 0; grid-row: auto; grid-column: auto; }
:root { --sl: max(8px, env(safe-area-inset-left, 0px)); --sr: max(8px, env(safe-area-inset-right, 0px)); --st: max(6px, env(safe-area-inset-top, 0px)); --sb: max(6px, env(safe-area-inset-bottom, 0px)); }
.glass { background: rgba(16, 11, 8, .84); border: 1px solid rgba(205, 167, 91, .55); }
/* 위쪽 정보 줄 */
#hud { position: absolute; top: var(--st); left: var(--sl); z-index: 4; display: flex; flex-direction: column; gap: 4px; pointer-events: none; max-width: calc(100% - 140px); }
#hud .hrow { display: flex; flex-direction: column; gap: 3px; }
.hs { background: rgba(16, 11, 8, .8); border: 1px solid rgba(205, 167, 91, .5); border-radius: 8px; padding: 2px 8px; display: flex; align-items: baseline; justify-content: space-between; gap: 8px; width: 118px; font-variant-numeric: tabular-nums; }
.hs small { font-size: 10px; color: var(--dim); line-height: 1.25; }
.hs b { font: 400 16px/1.1 "Black Han Sans", sans-serif; color: #f4ecd8; }
.hs.gold b { color: #ffd86a; } .hs.alert { border-color: #ff7a60; } .hs.alert b { color: #ff7a60; }
.nc { pointer-events: auto; cursor: pointer; width: 118px; background: rgba(16, 11, 8, .8); border: 1px solid var(--line); border-radius: 8px; padding: 3px 8px; font-size: 11px; line-height: 1.35; color: #f4ecd8; }
/* 유닛 능력치: 버프로 오른 값은 연한 빨강 굵게, 내린 값은 파랑 굵게. 상세를 누르면 출처가 가로로 펼쳐진다 */
.bup { color: #ff8f80 !important; font-weight: 800; }
.bdn { color: #6fb0ff !important; font-weight: 800; }
.sdbtn { font-size: 10px; padding: 0 6px; min-height: 18px; margin-left: 4px; border-radius: 6px; background: rgba(255,255,255,.08); border: 1px solid var(--line); color: var(--dim); vertical-align: middle; }
.sdet { display: flex; flex-wrap: wrap; gap: 4px 10px; margin: 3px 0 4px; font-size: 11.5px; color: #d8cbb0; }
.sdet span { white-space: nowrap; }
.sagerow { display: flex; align-items: center; gap: 8px; }
.sagerow > div { flex: 1; min-width: 0; }
.sagerow .spor { width: 40px; height: 40px; flex: none; border-radius: 8px; object-fit: cover; object-position: top; background: #1c140e; border: 1px solid var(--line); }
#hud .party { display: flex; flex-direction: column; gap: 3px; margin-top: 6px; }
#hud .pm { pointer-events: auto; display: grid; grid-template-columns: 26px minmax(0, 1fr); grid-template-rows: auto auto; column-gap: 5px; align-items: center; width: 118px; padding: 2px 5px 2px 2px; border-radius: 8px; background: rgba(16, 11, 8, .5); border: 1px solid rgba(205, 167, 91, .3); color: #f4ecd8; text-align: left; }
/* 라인 화면: 동료 카드는 「同盟 n」 버튼 하나로 접고, 누르면 버튼 오른쪽(전장 위)에 목록을 펼친다 */
#hud .party.fold { position: relative; margin-top: 6px; }
#hud .nc.ally { position: relative; font-weight: 700; text-align: left; }
#hud .nc.ally.open, #hud .nc.ally.on { border-color: #ffd86a; }
#hud .nc.ally b { color: #ffd86a; font-weight: 700; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; display: inline-block; max-width: 100%; vertical-align: bottom; }
#hud .nc.ally .dot { position: absolute; top: -6px; right: -6px; min-width: 16px; height: 16px; border-radius: 8px; background: #d8452f; color: #fff; font-size: 11px; line-height: 16px; text-align: center; }
#hud .allypop { position: absolute; left: calc(100% + 6px); top: 0; display: flex; flex-direction: column; gap: 3px; padding: 4px; border-radius: 10px; background: rgba(16, 11, 8, .86); border: 1px solid rgba(205, 167, 91, .5); pointer-events: auto; }
#hud .allypop .pm { background: rgba(40, 28, 18, .7); }
#hud .pm.on { border-color: #ffd86a; background: rgba(60, 40, 16, .6); }
#hud .pm.away { opacity: .5; }
#hud .pm .pi { grid-row: 1 / 3; width: 26px; height: 26px; border-radius: 50%; object-fit: cover; object-position: top; background: #1c140e; }
#hud .pm .pn { font-size: 11px; font-weight: 700; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; display: flex; align-items: center; gap: 2px; }
#hud .pm .rkm { width: 13px; height: 13px; flex: none; }
#hud .pm .ps { font-size: 9.5px; color: var(--dim); white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
.nc.boss { border-color: #f0b08a; } .nc.boss b { color: #f0b08a; } .nc.mid { border-color: var(--warn); color: var(--warn); }
/* 오른쪽 위: 배속·메뉴 */
#tr { position: absolute; top: var(--st); right: var(--sr); z-index: 4; display: flex; gap: 6px; }
.hb { min-width: 44px; height: 40px; padding: 0 10px; border-radius: 10px; background: rgba(16, 11, 8, .84); border: 1px solid rgba(205, 167, 91, .6); color: #f4ecd8; font: 700 14px var(--ui); display: inline-flex; align-items: center; justify-content: center; }
.hb[hidden] { display: none; }
.hb .ic, .rb .ic { width: 22px; height: 22px; fill: none; stroke: currentColor; stroke-width: 1.9; stroke-linecap: round; stroke-linejoin: round; }
#speedbtn { position: static; padding: 0 12px; }
/* 오른쪽 끝 버튼 열 */
#rail { position: absolute; right: var(--sr); top: 50%; transform: translateY(-50%); z-index: 4; display: flex; flex-direction: column; gap: 6px; }
#rail[hidden] { display: none; }
.rb { position: relative; width: 54px; height: 50px; border-radius: 12px; background: radial-gradient(circle at 50% 30%, #3a2a1c, #160f0a 80%); border: 1px solid rgba(205, 167, 91, .6); color: #f4ecd8; font: 700 10px/1.1 var(--ui); display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 2px; padding: 0; box-shadow: 0 2px 6px rgba(0, 0, 0, .45); }
.rb.on { border-color: #7dff8e; color: #b8ffc0; box-shadow: 0 0 10px rgba(125, 255, 142, .45); }
.rb.cur { background: radial-gradient(circle at 50% 30%, #6a4a24, #2a1a0e 80%); }
.rb .dot { position: absolute; top: -5px; right: -5px; min-width: 18px; padding: 0 4px; font: 700 11px/18px var(--ui); border-radius: 9px; background: var(--cinnabar); color: #fff; }
.rb .sub2 { font-size: 9px; color: #ffd86a; }
/* 아래 선택 막대: 유닛을 골랐을 때만 */
#selbar { position: absolute; left: 50%; transform: translateX(-50%); bottom: var(--sb); width: min(780px, calc(100% - 2 * (var(--sr) + var(--rw) + 10px))); z-index: 4; display: grid; grid-template-columns: minmax(0, 1fr) auto; grid-template-rows: auto auto; gap: 4px 8px; padding: 6px 8px; border-radius: 12px; background: rgba(20, 14, 10, .92); border: 1px solid rgba(205, 167, 91, .6); box-shadow: 0 4px 16px rgba(0, 0, 0, .5); }
#selbar[hidden] { display: none; }
/* 선택 정보 바(2026-11-23 안 A, 12-panels unitBar·13-info-timers renderInfo):
   위 [초상(등급 틀) | 가운데 4줄(이름·수치·인연 칩·기술 알약) | 큰 행동 1개], 아래 [가장 가까운 조합식 1줄 | 상세]. 상세는 바 위 카드 #ucard.
   선택 해제 X(#selx)는 바 왼쪽 위 모서리 밖에 둬서 오른쪽 큰 행동(해산)과 떨어뜨린다. 보스전 바(.boss)는 예전 그대로 */

/* 신고·차단은 한 번 누르면 '한 번 더'로 바뀐다(.arm). 차단 풀기 버튼(.unb) */

.unb { min-height: 44px; min-width: 44px; padding: 0 12px; margin-left: 6px; background: none; border: 1px solid var(--line); color: var(--paper); border-radius: 6px; font-size: 12px; }
#chatlog .sys { color: var(--dim); font-size: 12px; }
#chatlog .sys.warn, #lclog .sys.warn { color: #ff9a7a; }
/* 로비 채팅: 왼쪽 아래 한 줄 막대(누르면 창), 창 안의 기록·입력 */
#lchatbar { position: absolute; left: max(12px, env(safe-area-inset-left)); bottom: max(12px, env(safe-area-inset-bottom)); z-index: 3; max-width: min(44vw, 380px); height: 34px; padding: 0 12px; display: flex; align-items: center; gap: 8px; border: 1px solid rgba(201,164,92,.45); border-radius: 17px; background: rgba(14,9,6,.62); color: #e8dcc0; font: 600 12px var(--ui); text-align: left; }
#lchatbar[hidden] { display: none; }
#lchatbar b { color: #ffd86a; white-space: nowrap; flex: none; }
#lchatbar span { min-width: 0; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; color: #d8cbb0; font-weight: 400; }
#lchatbar span:empty { display: none; }
#lclog { height: min(46vh, 300px); overflow-y: auto; -webkit-overflow-scrolling: touch; touch-action: pan-y; font-size: 13px; line-height: 1.6; user-select: text; -webkit-user-select: text; border: 1px solid rgba(201,164,92,.22); border-radius: 8px; background: rgba(0,0,0,.22); padding: 6px 8px; }
#lclog .cl { display: flex; gap: 6px; align-items: baseline; }
#lclog .cl b { color: #ffd86a; white-space: nowrap; }
#lclog .cl span { min-width: 0; overflow-wrap: anywhere; }
#lclog .cl .op { margin-left: auto; display: flex; gap: 10px; flex: none; align-self: center; }
#lclog .cl .op button { min-height: 44px; min-width: 44px; font-size: 12px; padding: 0 10px; background: none; border: 1px solid var(--line); color: var(--dim); border-radius: 6px; }
#lclog .sys { color: var(--dim); font-size: 12px; }
#lchat .inline { margin-top: 8px; display: flex; gap: 6px; }
#lchat .inline input { flex: 1; min-width: 0; }
#lptabs button small { opacity: .75; font-weight: 400; }
#lptabs .lcwait { color: var(--dim); font-size: 12px; padding: 6px 2px; }
#chat .inline { margin-top: 6px; }
#ltoast { position: absolute; left: 50%; top: 70px; transform: translateX(-50%); z-index: 20; padding: 8px 14px; border-radius: 10px; background: rgba(20,14,10,.92); border: 1px solid var(--brass); color: #ffe9a8; font-weight: 700; }
#ltoast[hidden] { display: none; }
.setlist .row { display: flex; align-items: center; justify-content: space-between; gap: 8px; padding: 6px 0; }
.setlist .h { margin-top: 10px; color: var(--brass); font-weight: 700; }
@media (max-height: 430px) { #lmenu { grid-template-columns: repeat(4, 64px); top: auto; bottom: 100px; transform: none; } #lmenu button { height: 60px; } #battlebtn { height: 60px; min-width: 190px; font-size: 22px; } #lbrand h1 { font-size: 30px; } #lbrand { top: 56px; } }

/* ---- 로비 2·3차(철 재질·철괴 9-slice 틀)는 4·5차가 덮어써 보이지 않던 규칙이라 걷어 냈다(2026-11-18). 아래는 그중 아직 쓰이는 배치 규칙만 ---- */
#lgear { display: grid; place-items: center; }
#title button, #title .btn { overflow-wrap: anywhere; word-break: keep-all; line-height: 1.2; }
#lmenu button span { text-align: center; white-space: nowrap; }
#setup .choice button { height: auto; min-height: 52px; padding: 8px 8px; white-space: normal; }
#setup .choice button small { display: block; white-space: normal; line-height: 1.25; margin-top: 2px; }
#battlebtn span { display: block; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; padding: 0 10px; }
#lprof span { min-width: 0; max-width: 40vw; } #lprof b, #lprof small { display: block; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
.lp-head b, .wz-head b { flex: 1; min-width: 0; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
#lpclose, #wzclose { overflow: hidden; }
#lgear { margin-left: auto; } #lcur:not([hidden]) ~ #lgear { margin-left: 0; }
#lpbody .hs-sum b { word-break: keep-all; overflow-wrap: normal; }
/* 3차가 하던 바탕 지우기(맨 앞 기본 규칙의 둥근 상자·그림자가 다시 보이지 않게). 바탕·테두리는 아래 4·5·6차가 다시 정한다 */
#lmenu button, #lprof, #lcur .cur, #lgear, .lp-box, .wz-box, #lptabs button, .lp-card, .wz-foot .btn, #setup .choice button, .lp-sel button,
.lp-head button, .wz-head button, #battlebtn, #setup .sec, .hs-sum div, .hs-det, #chat, .hs-row { background: none; border-radius: 0; box-shadow: none; }
/* 전적 */
.hs-sum { display: grid; grid-template-columns: repeat(auto-fill, minmax(110px, 1fr)); gap: 6px; margin-bottom: 10px; }
.hs-sum div { padding: 6px 8px; border: 1px solid var(--line); border-radius: 8px; background: rgba(0,0,0,.25); font-size: 12px; } .hs-sum b { display: block; font-size: 16px; color: #ffe9a8; }
.hs-row { display: grid; grid-template-columns: 1fr auto auto; gap: 8px; align-items: center; padding: 8px 6px; border-bottom: 1px solid rgba(205,167,91,.15); cursor: pointer; }
.hs-row .w { color: #7dff8e; font-weight: 700; } .hs-row .l { color: #ff8a70; font-weight: 700; } .hs-row small { color: var(--dim); }
.hs-det { padding: 8px; background: rgba(0,0,0,.25); border-radius: 8px; margin: 2px 0 8px; font-size: 12px; }
.hs-det .ms { display: flex; flex-wrap: wrap; gap: 6px; margin: 4px 0 8px; } .hs-det .ms span { display: inline-flex; align-items: center; gap: 4px; padding: 2px 6px 2px 2px; border-radius: 12px; background: rgba(255,255,255,.06); }
.hs-det .ms img { width: 26px; height: 26px; border-radius: 50%; object-fit: cover; object-position: top; }
.hs-det .sg { display: grid; grid-template-columns: repeat(auto-fill, minmax(120px, 1fr)); gap: 4px 10px; }
#diffs button.lock { opacity: 1; filter: saturate(.35) brightness(.8); }
#diffs button .lk { display: block; margin-top: 3px; font: 700 11.5px "IBM Plex Sans KR", sans-serif; font-style: normal; color: #ffcf8a; white-space: normal; overflow-wrap: anywhere; font-size: 10.5px; line-height: 1.25; }
#matchbox { display: flex; flex-direction: column; align-items: center; gap: 10px; padding: 20px 8px; text-align: center; }
#matchbox .spin { width: 46px; height: 46px; border-radius: 50%; border: 4px solid rgba(255,216,106,.2); border-top-color: #ffd86a; animation: spin 1s linear infinite; }
@keyframes spin { to { transform: rotate(360deg); } }
#netbox[data-room="join"] #mk { display: none; } #netbox[data-room="create"] #code, #netbox[data-room="create"] #jn { display: none; }

/* ---- 로비 4차: 수묵화풍(먹·한지·주홍 인장). 밝은 노을 배경 위에 가벼운 종이 조각과 먹 글씨를 얹는다. 철 틀은 걷어 낸다. ----
   그림: gfx/lobby_bg.jpg(배경), lobby_char.png(배경 지운 캐릭터), ui_paper.jpg(한지), ui_ink.png(먹 붓자국) — 출처는 CREDITS.md */
#title { --ink2: #23130a; --verm: #b8301c; --gline: #c9a45c; --cream: #fbeeda; --pap: url(gfx/ui_paper.jpg) center/260px; }
#ldim { background: linear-gradient(180deg, rgba(70,28,12,.5) 0, rgba(70,28,12,0) 26%, rgba(30,12,6,0) 60%, rgba(26,10,5,.55) 100%); }
#lchar { left: 1%; width: min(46vw, 64vh); }
/* 위 줄: 한지 조각 */
#ltop { background: none; }
#lprof, #lcur .cur { border: 1px solid rgba(60,34,16,.5); border-image: none; border-radius: 6px; background: var(--pap); color: var(--ink2); box-shadow: 0 3px 10px rgba(40,14,6,.35); }
#lprof { padding: 4px 14px 4px 4px; gap: 9px; }
#lprof img { width: 42px; height: 42px; padding: 0; margin: 0; border-radius: 4px; border: 2px solid var(--verm); background: #2a1d14; box-sizing: border-box; }
#lprof b { color: var(--ink2); font: 400 16px var(--display); } #lprof small { color: #9a2a18; font-weight: 700; }
#lcur .cur { padding: 3px 10px 3px 4px; color: var(--ink2); }
#lgear { width: 44px; height: 44px; border: 1px solid rgba(60,34,16,.5); border-radius: 50%; background: var(--pap); color: var(--ink2); box-shadow: 0 3px 10px rgba(40,14,6,.35); }
/* 제목: 붓글씨 */
#lbrand { top: 58px; right: max(22px, env(safe-area-inset-right)); display: flex; align-items: center; justify-content: flex-end; gap: 12px; }
#lbrand h1 { font: 400 clamp(46px, 7.2vw, 92px)/0.95 "East Sea Dokdo", "Black Han Sans", serif; color: #1d1009; text-shadow: 0 0 16px rgba(255,238,206,.95), 0 0 4px rgba(255,238,206,.9); letter-spacing: .01em; }
html[lang="en"] #lbrand h1, html[lang="zh"] #lbrand h1 { font-size: clamp(34px, 5.2vw, 66px); }
#lbrand .seal { width: 50px; height: 50px; margin: 0; flex: none; order: 2; background: var(--verm); color: var(--cream); font-size: 22px; border-radius: 5px; box-shadow: inset 0 0 0 2px rgba(251,238,218,.5), 0 3px 8px rgba(40,14,6,.4); }
/* 메뉴: 주홍 인장 + 종이 이름표 */
#lmenu { grid-template-columns: repeat(3, 80px); gap: 12px; top: 52%; transform: translateY(-50%); }
#lmenu button { height: auto; padding: 0; gap: 7px; border: 0; background: none; justify-content: flex-start; }
#lmenu button i { width: 62px; height: 62px; display: grid; place-items: center; background: var(--verm); color: var(--cream); font: 900 30px/1 "Noto Serif KR", serif; border-radius: 6px; text-shadow: none; box-shadow: inset 0 0 0 2px rgba(251,238,218,.5), 0 5px 12px rgba(40,14,6,.45); transition: transform .12s; }
#lmenu button:nth-child(odd) i { transform: rotate(-3deg); } #lmenu button:nth-child(even) i { transform: rotate(2.5deg); }
#lmenu button:active i { transform: scale(.94); }
#lmenu button span { max-width: none; overflow: visible; text-overflow: clip; padding: 2px 8px; border-radius: 3px; background: var(--pap); color: var(--ink2); font: 700 12px var(--ui); text-shadow: none; box-shadow: 0 2px 6px rgba(40,14,6,.3); }
/* 전투 시작: 먹 붓자국 위의 붓글씨 + 출진 인장. 이어하기는 그 위의 종이 띠 */
#lplay { flex-direction: column; align-items: flex-end; gap: 8px; }
#battlebtn { position: relative; min-width: 330px; height: 96px; padding: 0 64px 4px 40px; border: 0; border-image: none; background: url(gfx/ui_ink.png) center/100% 100% no-repeat; color: var(--cream); font: 400 46px/1 "East Sea Dokdo", "Black Han Sans", serif; letter-spacing: .04em; text-shadow: 0 1px 0 #000; filter: drop-shadow(0 6px 10px rgba(30,12,6,.45)); }
html[lang="en"] #battlebtn, html[lang="zh"] #battlebtn { font-size: 34px; }
#battlebtn::after { content: '出陣'; position: absolute; right: 30px; top: 50%; width: 26px; padding: 5px 0; transform: translateY(-54%) rotate(4deg); writing-mode: vertical-rl; text-align: center; background: var(--verm); color: var(--cream); font: 900 13px/26px "Noto Serif KR", serif; letter-spacing: .1em; border-radius: 3px; box-shadow: inset 0 0 0 1px rgba(251,238,218,.5); text-shadow: none; }
#battlebtn:active { transform: scale(.97); }
#lplay #contbtn { height: auto; min-height: 40px; padding: 6px 14px; border: 1px solid rgba(60,34,16,.5); border-image: none; border-radius: 6px; background: var(--pap); color: var(--ink2); font: 700 14px var(--ui); text-shadow: none; box-shadow: 0 3px 10px rgba(40,14,6,.35); }
/* 창(상점·랭킹·전적·설정·시작 단계): 옻칠 바탕에 금선, 머리는 한지 */
#lpanel, #setup { background: rgba(30,12,6,.55); }
.lp-box, .wz-box { border: 1px solid var(--gline); border-image: none; border-radius: 10px; background: linear-gradient(180deg, #2b1d14, #1a110b); filter: none; box-shadow: 0 16px 50px rgba(20,8,4,.7); color: #efe4cc; }
.lp-head, .wz-head { padding: 9px 12px; background: var(--pap); border-bottom: 2px solid var(--verm); }
.lp-head b, .wz-head b { padding: 0 4px; background: none; color: var(--ink2); text-align: left; line-height: 34px; font: 400 20px/34px var(--display); text-shadow: none; }
#lpclose, #wzclose { width: 34px; height: 34px; border: 0; border-radius: 4px; background: var(--verm); color: var(--cream); font-size: 16px; }
#wzback { width: 34px; height: 34px; border: 1px solid rgba(60,34,16,.5); border-image: none; border-radius: 4px; background: none; color: var(--ink2); }
#wzsteps { color: #6b4a2c; }
#lptabs button, .lp-sel button { border: 1px solid rgba(201,164,92,.35); border-image: none; border-radius: 6px; background: rgba(255,240,210,.05); padding: 7px 12px; color: #e8dcc0; }
#lptabs button.on, .lp-sel button.on { background: var(--verm); border-color: #e9c98a; color: #fff3dc; filter: none; box-shadow: none; }
#setup .choice button, .lp-card { border: 1px solid rgba(201,164,92,.35); border-image: none; border-radius: 8px; background: rgba(255,240,210,.06); color: #e8dcc0; }
#setup .choice button.on, .lp-card.on { border-color: #e9c98a; background: rgba(184,48,28,.38); color: #fff3dc; box-shadow: inset 0 0 0 1px #e9c98a; }
#setup .sec, .hs-sum div, .hs-det, #chat, #lpbody .hs-sum div, #lpbody .hs-det { border: 1px solid rgba(201,164,92,.22); border-image: none; border-radius: 8px; background: rgba(0,0,0,.22); }
.hs-row, #lpbody .hs-row, #lpbody .setlist .row { border: 0; border-image: none; border-bottom: 1px solid rgba(201,164,92,.18); border-radius: 0; background: none; margin-bottom: 0; padding: 8px 6px; }
#setup .wz .btn, #lpbody .btn, #lpbody .setlist button:not(.zb), #lpbody .zb { border: 1px solid rgba(201,164,92,.45); border-image: none; border-radius: 6px; background: rgba(255,240,210,.07); padding: 5px 12px; color: #efe4cc; }
#lpbody .zb.on { background: var(--verm); border-color: #e9c98a; color: #fff3dc; filter: none; }
#lpbody .setlist .h { color: #e9c98a; text-shadow: none; }
.wz-foot { padding: 10px 12px; border-top: 1px solid rgba(201,164,92,.25); }
#setup .wz-foot .btn { min-height: 48px; border: 1px solid rgba(201,164,92,.5); border-image: none; border-radius: 6px; background: rgba(255,240,210,.07); color: #efe4cc; text-shadow: none; }
#setup .wz-foot .btn.go { background: var(--verm); border-color: #e9c98a; color: #fff3dc; filter: none; }
#ltoast { border-color: var(--gline); }
#lsay { background: var(--pap); color: var(--ink2); border: 1px solid rgba(60,34,16,.45); border-radius: 8px; }
/* ---- 게임 중 오른쪽 버튼(강화·명사·선택권·전황·자동): 테두리 선 없는 반투명 원형. 전장이 비쳐 보이고 아이콘만 또렷하다.
   이름은 아래 그림자 글씨. 자동이 켜지면 은은한 초록 빛줄기가 둘레를 돌고 화살표도 돈다 ---- */
/* --rw = 오른쪽 버튼 열(#rail)의 폭. 선택 창(#selbar)이 이만큼과 오른쪽 안전 영역(--sr)을 비워 버튼을 가리지 않는다 */
:root { --rw: 56px; }
@media (max-height: 430px) { :root { --rw: 52px; } }
@media (min-height: 600px) { :root { --rw: 72px; } }
#rail { gap: 4px; }
.rb { width: 56px; height: auto; padding: 0; gap: 1px; border: 0; border-radius: 0; background: none; box-shadow: none; color: #fff; font: 700 10px/1.2 var(--ui); overflow: visible; }
.rb .rc { position: relative; box-sizing: border-box; width: 44px; height: 44px; padding: 0; margin: 0; border: 0; border-radius: 50%; display: grid; place-items: center; place-content: center; font-style: normal; line-height: 0; /* 다른 규칙에서 물려받는 안쪽 여백이 있으면 그림이 한쪽으로 밀린다 */ background: rgba(14, 10, 8, .66); box-shadow: 0 2px 8px rgba(0, 0, 0, .35); transition: transform .08s, background .15s; }
.rb:active .rc { transform: scale(.92); background: rgba(14, 10, 8, .82); }
.rb .ri { width: 40px; height: 40px; object-fit: contain; pointer-events: none; filter: drop-shadow(0 1px 2px rgba(0, 0, 0, .55)); }
.rb .ic { width: 24px; height: 24px; margin: 0; color: rgba(255, 255, 255, .55); stroke-width: 2.2; }
.rb > span:not(.dot) { max-width: 60px; padding: 0 2px; background: none; border-radius: 0; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; color: rgba(255, 255, 255, .92); text-shadow: 0 1px 2px #000, 0 0 5px rgba(0, 0, 0, .9); }
.rb .dot { top: -2px; right: 2px; min-width: 16px; padding: 0 3px; font: 800 10px/16px var(--ui); border-radius: 8px; background: #e5483a; box-shadow: none; color: #fff; z-index: 2; }
.rb.cur { background: none; }
.rb.cur .rc { background: rgba(120, 84, 30, .78); box-shadow: 0 0 12px rgba(255, 200, 90, .45); }
.rb.cur > span:not(.dot) { color: #ffe9a8; }
.rb.on { border: 0; box-shadow: none; }
.rb.on .rc { background: rgba(22, 70, 36, .68); box-shadow: 0 0 12px rgba(125, 255, 142, .32); }
.rb.on .ic { color: #c8ffd0; animation: rbspin 2.8s linear infinite; }
.rb.on > span:not(.dot) { color: #c8ffd0; }
.rb.on .rc::before { content: ''; position: absolute; inset: 0; border-radius: 50%; pointer-events: none;
  background: conic-gradient(from 0deg, rgba(160, 255, 175, 0) 0deg 210deg, rgba(160, 255, 175, .85) 350deg, rgba(160, 255, 175, 0) 360deg);
  -webkit-mask: radial-gradient(farthest-side, transparent calc(100% - 2.5px), #000 calc(100% - 2px)); mask: radial-gradient(farthest-side, transparent calc(100% - 2.5px), #000 calc(100% - 2px));
  animation: rbspin 1.8s linear infinite; }
@keyframes rbspin { to { transform: rotate(360deg); } }
/* ---- 맵 왼쪽 시너지 줄: 육각 아이콘(대표 인물 얼굴) + 모은 수/필요 수. 덜 모은 것은 흑백으로 어둡게, 완성되면 금테 ---- */
#synbar { position: absolute; top: 200px; left: var(--sl); z-index: 4; display: grid; grid-template-columns: repeat(3, max-content); gap: 6px 4px; pointer-events: none; overflow-y: auto; overflow-x: hidden; overscroll-behavior: contain; scrollbar-width: none; padding: 7px 2px 4px 0; align-content: start; }
#synbar::-webkit-scrollbar { display: none; }
#synbar.scroll { pointer-events: auto; touch-action: pan-y; }
/* 인연 v0.3: 단계 점(위)·등급 배지(오른쪽 위)·다음 단계까지 1명 남음(near) */
.sy u { position: absolute; left: 50%; top: -6px; transform: translateX(-50%); display: flex; gap: 1px; text-decoration: none; pointer-events: none; }
.sy u i, .syn u.dt i { display: block; width: 4px; height: 4px; border-radius: 50%; background: rgba(20, 14, 10, .85); box-shadow: 0 0 0 1px rgba(214, 202, 176, .55); }
.sy u i.on, .syn u.dt i.on { background: #ffd86a; box-shadow: 0 0 0 1px #8a6414; }
.sy em { position: absolute; right: -4px; top: 2px; min-width: 11px; padding: 0 2px; border-radius: 5px; font: 700 8px/11px "IBM Plex Sans KR", sans-serif; font-style: normal; color: #1a120b; text-align: center; opacity: .55; }
.sy.on em { opacity: 1; }
.sy.near i { background: linear-gradient(160deg, #cfe6ff, #6aa8ff); }
.syn em.gd { display: inline-block; padding: 0 4px; border-radius: 5px; font: 700 9px/13px "IBM Plex Sans KR", sans-serif; font-style: normal; color: #1a120b; vertical-align: 1px; }
.syn u.dt { display: inline-flex; gap: 2px; text-decoration: none; vertical-align: 1px; }
#achpop.sp { pointer-events: auto; max-width: min(360px, 62vw); max-height: calc(100vh - 8px); overflow-y: auto; overscroll-behavior: contain; touch-action: pan-y; background: rgba(16, 11, 8, .9); }
#achpop .ac.lk { opacity: .3; border-style: dashed; } #achpop .ac.core { box-shadow: 0 0 0 1px #ffd86a; }
#achpop .sts { margin-top: 6px; display: grid; gap: 3px; } #achpop .st { display: grid; gap: 1px; padding: 3px 5px; border-left: 2px solid rgba(214, 202, 176, .25); font-size: 11px; line-height: 1.35; color: #b8ab90; }
#achpop .st.cur { border-left-color: #ffd86a; color: #f4ecd8; background: rgba(255, 216, 106, .08); } #achpop .st.past { color: #d6cab0; }
#achpop .st .tn { font-weight: 700; } #achpop .st em { margin-left: 5px; padding: 0 4px; border-radius: 5px; font: 700 9px/13px "IBM Plex Sans KR", sans-serif; font-style: normal; color: #1a120b; }

/* ---- 출시 전 UX 점검(2026-11-18): 누르는 곳 44px, 확인·진행 표시, 결과창 '다음 목표' 칸 등. 그림은 새로 쓰지 않는다 ---- */
/* 누르는 곳 44px: 보이는 크기를 그대로 둘 곳은 ::after로 누르는 범위만 넓힌다 */
/* #lchatbar는 왼쪽 아래 absolute 그대로 둔다(relative를 주면 맨 위 흐름으로 올라가 프로필을 덮는다. absolute도 ::after의 기준이 된다) */
#lpclose, #wzclose, #wzback, .acc-track .acc-q, .sypg button, .sdbtn { position: relative; }
#lpclose::after, #wzclose::after, #wzback::after, #lnews::after { content: ''; position: absolute; inset: -5px; }

.lp-card .btn, .acc-btns .btn, .acc-danger .btn, .lp-sel button, #lptabs button, #tutbox .btn, #lbcopy, #lbleave, .lp-note .btn, #matchbox .btn { min-height: 44px; }

#pane[data-tab="set"] .zones, .setlist .zones { gap: 4px; flex-wrap: wrap; justify-content: flex-end; }

/* ---- 협동 입장 대기 화면(#match, src/ui/18b-match.js) ----
   참가자 카드가 나란히 서고, 계급이 높을수록 화려하다(.t0 ~ .t4). 연출은 있는 그림만 움직인다:
   ray_sun(빛살)·pic_star(별)은 흰 그림이라 마스크로 써서 금색을 입히고, fxa_ring(5×4칸)·fxa_burst(6×5칸)은 steps()로 칸을 넘긴다(칸 수는 art.js FXA_META).
   글꼴은 전부 기본 글꼴(닉네임에 붓글씨 글꼴에 없는 글자가 섞인다). */
#match { position: fixed; inset: 0; z-index: 58; display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 5px; box-sizing: border-box; padding: calc(var(--st, 0px) + 6px) calc(var(--sr, 0px) + 12px) calc(var(--sb, 0px) + 6px) calc(var(--sl, 0px) + 12px); background: linear-gradient(rgba(10, 7, 5, .8), rgba(10, 7, 5, .9)), #120c08 url(gfx/lobby_bg.jpg?v=3) center / cover no-repeat; color: #f4ecd8; overflow: hidden; }
#match[hidden] { display: none; }
#match, #match * { font-family: var(--ui) !important; letter-spacing: 0 !important; }
#match i { font-style: normal; }
.mt-head { flex: none; display: flex; align-items: center; gap: 12px; }
.mt-diff { padding: 5px 34px 6px; background: url(gfx/ui_title.png) center / 100% 100% no-repeat; font-size: 15px; font-weight: 700; line-height: 1.3; white-space: nowrap; text-shadow: 0 1px 2px #000; }
.mt-wait { font-size: 13px; color: #e9dcc0; text-shadow: 0 1px 3px #000; animation: mtBlink 1.6s ease-in-out infinite; }
.mt-row { flex: none; display: grid; grid-auto-columns: minmax(0, 132px); grid-template-rows: auto auto; justify-content: center; align-items: center; column-gap: 12px; row-gap: 6px; width: 100%; padding: 24px 0 0; }
.mt-slot { --sc: 1; grid-row: 1; position: relative; min-width: 0; transform: scale(var(--sc)); transform-origin: 50% 100%; animation: mtIn .5s cubic-bezier(.2, .9, .3, 1.2) var(--d, 0s) backwards; }
.mt-still .mt-slot { animation: none; }
.mt-card { position: relative; display: flex; flex-direction: column; align-items: center; gap: 1px; box-sizing: border-box; height: 214px; padding: 0 2px 2px; border-style: solid; border-width: 9px; border-image: url(gfx/ui_frame.png) 20 fill stretch; text-align: center; }
.mt-glow { position: absolute; inset: -6px; overflow: hidden; pointer-events: none; }
.mt-emb { position: relative; flex: none; width: 100%; height: 98px; display: grid; place-items: center; }
.mt-rk { position: relative; z-index: 1; width: 62px; height: 62px; object-fit: contain; filter: drop-shadow(0 2px 4px rgba(0, 0, 0, .7)); }
.mt-ic { position: absolute; z-index: 2; right: 8px; bottom: 2px; width: 34px; height: 34px; border-radius: 50%; border: 1px solid rgba(205, 167, 91, .7); background: #2b1f15; object-fit: cover; }
.mt-nm { position: relative; z-index: 1; max-width: 100%; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; font-size: 14px; font-weight: 700; line-height: 1.35; color: #f4ecd8; text-shadow: 0 1px 2px #000; }
.mt-gr { position: relative; z-index: 1; max-width: 100%; min-height: 15px; font-size: 11px; line-height: 1.3; color: #d8c79c; overflow: hidden; display: -webkit-box; -webkit-box-orient: vertical; -webkit-line-clamp: 2; }
.mt-lv { position: relative; z-index: 1; font-size: 11px; line-height: 1.3; color: #b9ab8c; font-variant-numeric: tabular-nums; }
.mt-st { position: relative; z-index: 1; margin-top: auto; font-size: 11px; line-height: 1.4; color: #b9ab8c; animation: mtBlink 1.2s ease-in-out infinite; }
.mt-st.ok { color: #7dff8e; font-weight: 700; animation: none; }
.mt-tag { position: absolute; z-index: 3; top: -6px; padding: 0 6px; border-radius: 3px; font-size: 10px; font-weight: 700; line-height: 16px; }
.mt-tag.host { left: -6px; background: #c99a2e; color: #14100d; }
.mt-tag.mine { right: -6px; background: #7dff8e; color: #0c2410; }
.mt-slot.me .mt-card { outline: 2px solid #7dff8e; outline-offset: 1px; }
.mt-next { grid-row: 2; align-self: start; word-break: keep-all; min-height: 30px; font-size: 11px; line-height: 1.35; color: #e9dcc0; text-align: center; text-shadow: 0 1px 2px #000; }
.mt-next b { color: #ffd86a; }
.mt-tip { flex: none; max-width: 100%; font-size: 12px; line-height: 1.4; color: #cdbf9f; text-shadow: 0 1px 2px #000; text-align: center; }
/* 빛살·별: 그림을 마스크로 쓰고 색을 입힌다 */
.mt-ray, .mt-aura, .mt-star { position: absolute; display: block; pointer-events: none; background-color: var(--gc, #ffd86a); -webkit-mask: var(--mk) center / contain no-repeat; mask: var(--mk) center / contain no-repeat; }
.mt-ray, .mt-aura { --mk: url(gfx/ray_sun.png?v=1); left: 50%; aspect-ratio: 1; animation: mtSpin 26s linear infinite; }
.mt-ray { top: 55px; width: var(--rw, 150px); margin: calc(var(--rw, 150px) / -2) 0 0 calc(var(--rw, 150px) / -2); opacity: var(--ro, .4); }
.mt-ray.r2 { --gc: #fff3c4; animation-duration: 15s; animation-direction: reverse; opacity: .55; }
.mt-aura { top: 64px; width: 290px; margin: -145px 0 0 -145px; opacity: var(--ao, .3); animation-duration: 40s; animation-direction: reverse; }
.mt-star { --mk: url(gfx/pic_star.png?v=1); z-index: 2; width: 11px; height: 11px; margin: -5px 0 0 -5px; opacity: 0; animation: mtStar 3.4s ease-in-out infinite; }
/* 프레임 시트: i가 한 칸만 보이게 자르고, b가 줄(세로)을, img가 칸(가로)을 넘긴다. 가로 한 바퀴 시간 = 세로 한 줄 시간 */
.mt-fx { position: absolute; left: 50%; top: 50%; display: block; overflow: hidden; pointer-events: none; }
.mt-fx b { display: block; width: 100%; }
.mt-fx img { display: block; height: 100%; max-width: none; }
/* 고리(5칸 × 4줄, 1.6초 돌고 1.6초 쉰다): 파란 그림이라 색조를 금빛으로 돌린다 */
.mt-ring { width: 150px; height: 150px; margin: -75px 0 0 -75px; filter: hue-rotate(205deg) saturate(1.5) brightness(1.5); opacity: .9; }
.mt-ring b { height: 400%; animation: mtRows 3.2s linear infinite; }
.mt-ring img { width: 500%; animation: mtCols .4s steps(5) infinite; }
/* 터짐(6칸 × 5줄): 카드가 나타날 때 한 번 */
.mt-burst { z-index: 3; width: 230px; height: 230px; margin: -115px 0 0 -115px; opacity: 0; animation: mtBurst 1s ease-out var(--d, 0s) 1; }
.mt-burst b { height: 500%; animation: mtY 1s steps(5) var(--d, 0s) 1 both; }
.mt-burst img { width: 600%; animation: mtCols .2s steps(6) var(--d, 0s) 5; }
.mt-still .mt-burst { display: none; }
/* 계급 단계 */
.mt-slot.t1 { --rw: 128px; --ro: .42; --gc: #e2c27a; }
.mt-slot.t1 .mt-card { box-shadow: 0 0 0 1px #c99a2e; }
.mt-slot.t2 { --sc: 1.03; --rw: 176px; --ro: .6; z-index: 1; }
.mt-slot.t2 .mt-card { box-shadow: 0 0 0 1px #e6c067, 0 0 12px rgba(255, 216, 106, .3); }
.mt-slot.t2 .mt-rk { width: 70px; height: 70px; }
.mt-slot.t3 { --sc: 1.06; --rw: 200px; --ro: .72; --ao: .26; z-index: 2; }
.mt-slot.t3 .mt-card { box-shadow: 0 0 0 2px #ffd86a, 0 0 16px rgba(255, 216, 106, .45); }
.mt-slot.t3 .mt-rk { width: 76px; height: 76px; }
.mt-slot.t4 { --sc: 1.1; --rw: 236px; --ro: .9; --ao: .46; z-index: 3; }
.mt-slot.t4 .mt-card { box-shadow: 0 0 0 2px #ffe9a8, 0 0 22px rgba(255, 216, 106, .7); }
.mt-slot.t4 .mt-rk { width: 86px; height: 86px; animation: mtPulse 2.6s ease-in-out infinite; }
.mt-slot.t4 .mt-nm { color: #ffd86a; font-size: 15px; text-shadow: 0 0 8px rgba(255, 200, 80, .8), 0 1px 2px #000; }
.mt-slot.t3 .mt-gr, .mt-slot.t4 .mt-gr { color: #ffe9a8; }
@keyframes mtIn { from { opacity: 0; transform: translateY(22px) scale(calc(var(--sc) * .86)); } }
@keyframes mtBlink { 50% { opacity: .45; } }
@keyframes mtSpin { to { transform: rotate(360deg); } }
@keyframes mtPulse { 50% { transform: scale(1.07); } }
@keyframes mtStar { 0% { opacity: 0; transform: translateY(12px) scale(.4) rotate(0deg); } 30% { opacity: 1; } 100% { opacity: 0; transform: translateY(-44px) scale(1.1) rotate(50deg); } }
@keyframes mtCols { to { transform: translateX(-100%); } }
@keyframes mtY { to { transform: translateY(-100%); } }
@keyframes mtRows { 0% { transform: translateY(0); animation-timing-function: steps(4); } 50%, 100% { transform: translateY(-100%); } }
@keyframes mtBurst { 0% { opacity: 1; transform: scale(.5); } 70% { opacity: 1; } 100% { opacity: 0; transform: scale(1.25); } }
/* 낮은 화면(가로 폰 320~340px 높이): 카드를 줄인다 */
@media (max-height: 350px) { .mt-card { height: 190px; } .mt-emb { height: 80px; } .mt-ray { top: 46px; } .mt-row { padding-top: 19px; } .mt-tip { font-size: 11px; } }
@media (max-width: 700px) { .mt-row { column-gap: 7px; } .mt-ic { width: 28px; height: 28px; right: 2px; } .mt-slot.t2 { --sc: 1.02; } .mt-slot.t3 { --sc: 1.03; } .mt-slot.t4 { --sc: 1.05; } }
/* 움직임 줄이기: 전부 멈추고 프레임 그림은 뺀다(별은 제자리에) */
@media (prefers-reduced-motion: reduce) { #match *, #match { animation: none !important; } .mt-fx { display: none; } .mt-star { opacity: .8; } }
/* 계정 창 관직 표의 계급 문장(작게) */
.acc-tree td.rk { white-space: nowrap; }
.acc-tree td.rk img { width: 22px; height: 22px; margin: -4px 4px -4px 0; vertical-align: middle; object-fit: contain; }
/* ---- 협동 입장 대기 화면 끝 ---- */
/* ==== 6차 다듬기(2026-11-18, 팀 점검 polish-art·polish-ux·polish-ingame) ====
   틀은 둘: 밝은 한지(로비 위에 얹는 작은 조각·말풍선·알림) / 어두운 비단 두루마리(창 전부: 첫 설정·로비 창·전투 시작·결과).
   버튼은 넷: 주 버튼(주홍 + 금테) / 보통(어두운 바탕 + 금테) / 선택 칸(보통과 같고 고르면 주홍) / 위험(테두리·글자만 경고색). 로비의 먹 붓자국 출진은 따로.
   색은 변수로: 주홍 --verm(눌림 --verm-d), 금 3단계 --gold-line(선) · --gold-txt(글자) · --gold-hi(강조). 둥글기는 --r-s 4px / --r-m 6px / 원.
   그림: gfx/ui_logo.png(제목 현판), ui_rod.png(두루마리 축), ic_coin·ic_news·ic_lock·ic_close·ic_back·ic_gear(작은 아이콘), ui_joy·ui_knob·ic_attack(보스전 조작).
   그림이 아직 없으면 lobby.js가 <html>에 noic-<이름>을 붙이고, 아래 규칙이 예전 글자·모양으로 돌아간다. */
:root {
  --verm: #b8301c; --verm-d: #8a2112; --cinnabar: var(--verm);
  --gold-line: #c9a45c; --gold-txt: #f3deb0; --gold-hi: #ffd86a; --brass: var(--gold-line);
  --r-s: 4px; --r-m: 6px;
  --ink2: #23130a; --cream: #fbeeda; --pap: url(gfx/ui_paper.jpg) center/260px;
  --silk: linear-gradient(180deg, rgba(22,13,8,.5), rgba(22,13,8,.72)), url(gfx/ui_silk.jpg) center/230px;
  --silk-edge: inset 0 0 0 1px rgba(201,164,92,.55), inset 0 0 0 6px rgba(20,12,8,.85), inset 0 0 0 7px rgba(201,164,92,.25), 0 18px 50px rgba(20,8,4,.75);
}
#title { --verm: #b8301c; --gline: var(--gold-line); }
/* 일본어 본문 글꼴: 일본어 고딕을 먼저(숫자·가나·한자가 한 글꼴에서 나오게) */
html[lang="ja"] { --ui: "Hiragino Sans", "Hiragino Kaku Gothic ProN", "Noto Sans CJK JP", "Noto Sans JP", "Yu Gothic UI", "Meiryo", "IBM Plex Sans KR", sans-serif; }

/* ---- 작은 아이콘 그림 ---- */
.ico { display: inline-block; width: 1.25em; height: 1.25em; vertical-align: -.28em; flex: none; font-style: normal; background: center / contain no-repeat; }
.ico.coin { background-image: url(gfx/ic_coin.png); } .ico.news { background-image: url(gfx/ic_news.png); } .ico.lock { background-image: url(gfx/ic_lock.png); }
.ico.close { background-image: url(gfx/ic_close.png); } .ico.back { background-image: url(gfx/ic_back.png); } .ico.gear { background-image: url(gfx/ic_gear.png); }
.ico::after { display: block; text-align: center; line-height: inherit; font-weight: 700; }
.noic-coin .ico.coin::after { content: '銅'; } .noic-news .ico.news::after { content: '報'; } .noic-lock .ico.lock::after { content: '🔒'; font-size: .8em; }
.noic-close .ico.close::after { content: '✕'; } .noic-back .ico.back::after { content: '‹'; font-size: 1.3em; line-height: .9; } .noic-gear .ico.gear::after { content: '⚙'; }

/* ---- 버튼 넷(공통) ---- */
.btn { border-radius: var(--r-m); transition: transform .08s, filter .12s; }
.btn.go { background: var(--verm); border-color: #e9c98a; color: #fff3dc; }
.btn.warn { background: transparent; border-color: #c8402e; color: #ffb0a0; }
.btn:disabled { opacity: .45; }
#setup .wz .btn, #lpbody .btn, #lpbody .setlist button:not(.zb), #lpbody .zb, .boot-card .btn, #accbox .btn, #lpbody .unb {
  border: 1px solid rgba(201,164,92,.6); border-radius: var(--r-m); background: rgba(20,12,8,.72); color: #efe4cc; }

#setup .choice button.on, .lp-card.on, .boot-track button.on, .acc-track button[data-track].on { background: var(--verm); border-color: #e9c98a; color: #fff3dc; box-shadow: inset 0 0 0 1px #e9c98a; }

/* 눌림: 0.96배 + 조금 어둡게(네 가지 버튼 모두 같은 규칙) */

#backbtn:active, #tutgift .btn:active { transform: translateX(-50%) scale(.96); }
.hb, .toggle, .zb, .choice button, #lptabs button, .lp-sel button, .cmd { transition: transform .08s, filter .12s; }

/* ---- 로딩 화면: 제목 현판 · 한지 진행 막대 · 첫 설정은 두루마리 ---- */
/* 현판은 9-slice: 네 모서리 장식(위 구름무늬·아래 술)은 그대로, 가운데만 늘어난다 */
.logo { border-style: solid; border-color: transparent; border-width: 18px 46px 28px; border-image: url(gfx/ui_logo.png) 22% 15% 32% 15% fill / 18px 46px 28px stretch; padding: 0 4px; }
.boot-brand h1, #lbrand h1 { color: #ffe9b0; text-shadow: 0 2px 0 #3a1408, 0 0 10px rgba(0,0,0,.7), 0 0 2px #000; }
.boot-bar { height: 14px; padding: 2px; border: 1px solid rgba(60,34,16,.6); border-image: none; border-radius: 7px; background: var(--pap); box-shadow: 0 2px 8px rgba(0,0,0,.5); }
.boot-bar i { border-radius: 5px; }
#bootmsg { font-size: 13.5px; text-shadow: 0 1px 3px #000, 0 0 6px #000; }
.boot-card { border: 0; border-image: none; border-radius: var(--r-s); background: var(--silk); box-shadow: var(--silk-edge); filter: none; padding: 0 18px 10px; }

.boot-card .step { color: var(--gold-line); letter-spacing: .3em; }
.boot-card input[type="text"], #accbox input:not([type="checkbox"]), #lchat .inline input, #chat .inline input, #setup #code {
  background: rgba(10,6,4,.6); border: 1px solid rgba(201,164,92,.55); border-radius: var(--r-m); color: var(--paper); padding: 6px 10px; }
.boot-card input[type="checkbox"], #accbox .agree input { accent-color: var(--verm); }
@media (max-height: 400px) { .boot-card { border-width: 0; } }

/* ---- 두루마리 창: 위아래 나무 축 그림(가운데만 늘어난다) ---- */
.lp-box::before, .lp-box::after, .wz-box::before, .wz-box::after, #end .sheet.es::before, #end .sheet.es::after, .boot-card::before, .boot-card::after {
  content: ''; flex: none; height: 16px; border-radius: 0; background: none; box-shadow: none; z-index: 3;
  border-style: solid; border-color: transparent; border-width: 0 24px; border-image: url(gfx/ui_rod.png) 0 12% fill / 0 24px / 0 stretch; filter: drop-shadow(0 2px 3px rgba(0,0,0,.55)); }
.boot-card::before, .boot-card::after { margin: 0 -18px; }
.boot-card::before { position: sticky; top: 0; }
/* 창 크기 고정: 단계·탭이 바뀌어도 창이 튀지 않는다. 열릴 때 살짝 커지며 나타난다 */
#lpanel, #setup { background: rgba(14,6,3,.74); grid-template: minmax(0, 1fr) / minmax(0, 1fr); }
.lp-box, .wz-box { width: min(760px, 100%); height: min(100%, 540px); justify-self: center; align-self: center; animation: winIn .18s ease-out; }
#lpbody { flex: 1 1 auto; min-height: 0; }
@keyframes winIn { from { opacity: 0; transform: scale(.965); } to { opacity: 1; transform: none; } }
/* 창 제목 한 줄만 명조(고정 문구라 빠지는 글자가 없다). 닉네임·본문은 기본 고딕 그대로 */
#lpanel .lp-head b, #setup .wz-head b { font-family: var(--serif) !important; font-weight: 700 !important; font-size: 22px !important; letter-spacing: .08em !important; color: var(--gold-txt); text-shadow: 0 2px 4px rgba(0,0,0,.7); }
#lpclose, #wzclose, #wzback { width: 40px; height: 40px; padding: 0; display: grid; place-items: center; border: 1px solid rgba(201,164,92,.7); border-radius: 50%; background: rgba(20,12,8,.78); color: var(--gold-txt); font-size: 18px; }
#lpclose .ico, #wzclose .ico, #wzback .ico { width: 26px; height: 26px; line-height: 26px; }
#wzsteps { color: var(--gold-line); font-size: 11px; letter-spacing: .25em; }
/* 탭: 게임 안 서랍과 같은 군기 그림(ui_c_flag_*) + 글자. 고른 탭은 붉은 깃발·금 글자·금 밑줄 */
#lptabs { gap: 2px; padding: 2px 16px 0; align-items: flex-end; border-bottom: 1px solid rgba(201,164,92,.2); }
#lptabs button { clip-path: none; display: inline-flex; align-items: center; gap: 5px; min-height: 44px; padding: 4px 10px 4px 6px; border: 0; border-bottom: 2px solid transparent; border-radius: 0; background: none; color: #d8c8a8; font-weight: 700; font-size: 13px; }
#lptabs button::before { content: ''; flex: none; width: 18px; height: 24px; background: url(gfx/ui_c_flag_off.png) center / contain no-repeat; filter: drop-shadow(0 1px 2px rgba(0,0,0,.6)); }
#lptabs button.on { background: none; color: var(--gold-hi); border-bottom-color: var(--gold-hi); box-shadow: none; }
#lptabs button.on::before { background-image: url(gfx/ui_c_flag_on.png); }
/* 탭 아래 세부 고르기(랭킹 모드·난이도): 탭보다 한 단계 약하게(테두리만, 고르면 금테 + 밑줄) */
.lp-sel button { background: transparent; border: 1px solid rgba(201,164,92,.35); border-radius: var(--r-m); color: #d8cbb0; }
.lp-sel button.on { background: rgba(201,164,92,.12); border-color: var(--gold-hi); color: var(--gold-hi); text-decoration: underline; text-underline-offset: 3px; filter: none; }
/* 빈 화면: 가운데 */
.lp-empty { padding: 48px 0; text-align: center; font-size: 14px; color: var(--dim); }
/* 일본어 줄바꿈: 낱말 가운데·문장 끝 한두 글자가 넘어가지 않게(지원 안 되는 기기에서는 그대로) */
.lp-note, .hint2, #tutbox .tt, .boot-card p, .boot-card .agree span, #end .es-goal, #end .es-lost, .acc-link .hint2, .news li, #lsay, #ltoast { text-wrap: pretty; word-break: auto-phrase; }

#lpbody, .wz-box .wz, #end .es-body, #drawer #pane, #drawer #timers, .boot-card, #lclog, #chatlog { scrollbar-width: thin; scrollbar-color: rgba(201,164,92,.6) transparent; }

/* ---- 로비 ---- */
/* 제목: 옻칠 현판 위에 금빛 글자, 인장은 현판 왼쪽(로딩 화면과 같은 자리) */
#lbrand { top: 52px; gap: 10px; }
#lbrand .seal { order: 0; }
@media (max-height: 430px) { #lbrand { top: 48px; } .logo { border-width: 14px 38px 22px; border-image-width: 14px 38px 22px; } }
/* 캐릭터: 프로필 카드가 올린 손을 가리지 않게 조금 아래로, 노을빛에 맞춰 채도를 살짝 낮춘다 */
#lchar { height: calc(100% - 56px); }
#lcharcv { filter: saturate(.9) sepia(.06); }
/* 위 줄 오른쪽(재화·소식·설정): 같은 한지 틀, 그림 아이콘 */
#lcur .cur i.ico { width: 26px; height: 26px; border-radius: 0; background: url(gfx/ic_coin.png) center / contain no-repeat; font-size: 12px; line-height: 26px; }
.noic-coin #lcur .cur i.ico { background: #a0702a; border-radius: 50%; color: #fff3c8; }
#lnews, #lgear { width: 44px; height: 44px; padding: 0; display: grid; place-items: center; border: 1px solid rgba(60,34,16,.5); border-radius: 50%; background: var(--pap); color: var(--ink2); box-shadow: 0 3px 10px rgba(40,14,6,.35); }
#lnews .ico, #lgear .ico { width: 32px; height: 32px; font-size: 17px; line-height: 32px; }
#lnews .dot { top: 0; right: 0; width: 11px; height: 11px; }
/* 채팅 줄: 왼쪽 아래 한지 띠 */
#lchatbar { border: 1px solid rgba(60,34,16,.5); border-radius: var(--r-s); background: var(--pap); color: var(--ink2); box-shadow: 0 3px 10px rgba(40,14,6,.35); }
#lchatbar b { color: var(--verm); } #lchatbar span { color: #4a3220; }
/* 메뉴 이름표: 폭을 맞춘다. 잠긴 메뉴는 회색 대신 채도 낮춤 + 어둡게 + 가운데 자물쇠, 이름표 아래에 여는 조건 */
#lmenu button span { min-width: 76px; }
#lmenu button.locked { filter: none; }
#lmenu button.locked i { filter: saturate(.25) brightness(.62); }
#lmenu button.locked::after { content: ''; right: auto; left: 50%; top: 16px; width: 34px; height: 34px; margin-left: -17px; background: url(gfx/ic_lock.png) center / contain no-repeat; filter: drop-shadow(0 2px 3px rgba(0,0,0,.8)); font-size: 22px; text-align: center; line-height: 34px; }
.noic-lock #lmenu button.locked::after { content: '🔒'; background: none; }
#lmenu .lkn { margin-top: -3px; font: 700 10px/1.2 var(--ui); color: #fff3dc; text-shadow: 0 1px 2px #000, 0 0 4px #000; white-space: nowrap; }
#lmenu .lkn[hidden] { display: none; }
/* 알림: 제목에 겹치지 않게 맨 위 가운데, 한지 띠, 위에서 내려온다 */
#ltoast { top: max(10px, env(safe-area-inset-top)); max-width: min(560px, 76vw); padding: 8px 18px; border: 1px solid rgba(60,34,16,.5); border-radius: var(--r-s); background: var(--pap); color: var(--ink2); box-shadow: 0 4px 14px rgba(20,8,4,.5); font-weight: 700; text-align: center; }
#ltoast.in { animation: ltoastIn .22s ease-out; }
@keyframes ltoastIn { from { opacity: 0; transform: translate(-50%, -12px); } to { opacity: 1; transform: translate(-50%, 0); } }
/* 안내 말풍선: 한지(로비의 캐릭터 말풍선과 같은 틀), 버튼은 공통 버튼 */
#tutbox { border: 1px solid rgba(60,34,16,.55); border-radius: var(--r-m); background: var(--pap); color: var(--ink2); box-shadow: 0 8px 24px rgba(0,0,0,.55); }
#tutbox b { color: var(--verm); } #tutbox small { color: #6b4a2c; }
#tutbox .btn { border: 1px solid rgba(60,34,16,.5); background: rgba(255,250,240,.55); color: var(--ink2); }
#tutbox .btn.go { border-color: #e9c98a; background: var(--verm); color: #fff3dc; }

/* ---- 로비 창 안 ---- */
/* 계정: 이름 / 관직·레벨 두 줄, 관직 문장, 10px 경험치 막대 + 다음 관직까지 */
.acc-card { grid-template-columns: 60px minmax(0, 1fr); gap: 2px 12px; }
.acc-card .badge { grid-row: 1 / 5; width: 60px; height: 60px; border-radius: 0; background: none; box-shadow: none; color: var(--gold-hi); font-size: 24px; }
.acc-card .badge img { width: 100%; height: 100%; object-fit: contain; filter: drop-shadow(0 3px 5px rgba(0,0,0,.6)); }
.acc-nm { display: flex; align-items: baseline; gap: 8px; min-width: 0; } .acc-nm b { min-width: 0; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; font-size: 18px; font-weight: 700; color: #f4ecd8; }
.acc-card .gr { font-size: 13px; }
.acc-card .xpbar { height: 10px; border-radius: 5px; border: 1px solid rgba(201,164,92,.4); background: rgba(0,0,0,.35); }
.acc-nx { font-size: 11.5px; color: var(--dim); }
.acc-link { border: 1px solid rgba(201,164,92,.3); border-radius: var(--r-m); background: rgba(0,0,0,.2); }
/* 계정 창 줄 순서: 아이콘 고르기를 위로, 계정 삭제는 맨 아래(경고색) */
#lpanel[data-kind="account"] #lpbody { display: flex; flex-direction: column; gap: 4px; }
#lpanel[data-kind="account"] #accbox { display: contents; }
#lpanel[data-kind="account"] #lpicons { order: 1; }
#lpanel[data-kind="account"] .acc-danger, #lpanel[data-kind="account"] #acc-delbox, #lpanel[data-kind="account"] #acc-err, #lpanel[data-kind="account"] .rank-list { order: 2; }
#lpanel[data-kind="account"] .acc-danger { margin-top: 18px; }
#lpbody .lp-card.on .btn:disabled { opacity: 1; color: var(--gold-hi); border-color: var(--gold-hi); background: rgba(0,0,0,.3); }
#lpbody .lp-card.on .btn:disabled::before { content: '✓ '; }
/* 미션: 진행 막대 + n/m, 받을 수 있을 때만 받기 버튼 */
.ms-row { grid-template-columns: minmax(0, 1fr) 118px auto 96px; }
.ms-row .pg { display: flex; align-items: center; gap: 6px; font-variant-numeric: tabular-nums; }
.ms-bar { display: block; flex: 1; height: 6px; border-radius: 3px; background: rgba(255,255,255,.1); overflow: hidden; }
.ms-bar b { display: block; height: 100%; background: linear-gradient(90deg, #c99a2e, #ffe9a8); }
.ms-row.done .ms-bar b, .ms-row.got .ms-bar b { background: var(--good); }
.ms-row .rw .ico, .lp-bal .ico, .lp-card .btn .ico { margin-right: 3px; }
.ms-row .ms-got { color: var(--good); }
/* 전적 요약: 다섯 칸 한 줄, 큰 숫자 + 작은 설명 */
#lpbody .hs-sum { grid-template-columns: repeat(5, minmax(0, 1fr)); }
#lpbody .hs-sum div { display: flex; flex-direction: column; align-items: center; gap: 1px; padding: 6px 4px; text-align: center; }
.hs-sum span { font-size: 11.5px; color: #d8cbb0; } .hs-sum b { font-size: 18px; } .hs-sum small { font-size: 10px; color: var(--dim); }
/* 설정: 음량 −/+는 작게, 판 안 설정 탭은 버튼 줄이 넘치면 아랫줄로(겹치지 않게) */
.setlist .volrow .toggle, #pane[data-tab="set"] .volrow .toggle { min-width: 40px; min-height: 36px; padding: 0; font-size: 16px; }
#pane[data-tab="set"] .row { flex-wrap: wrap; } #pane[data-tab="set"] .row > div:first-child { flex: 1 1 150px; }
/* 업데이트 내역 목록 점: 금색 '・' */
.news ul { list-style: none; padding-left: 2px; } .news li { position: relative; margin: 4px 0; padding-left: 14px; } .news li::before { content: '・'; position: absolute; left: 0; color: var(--gold-hi); }

/* ---- 전투 시작 창 ---- */
#setup .wz-foot .btn { min-width: 150px; min-height: 46px; padding: 0 20px; border-radius: var(--r-m); font: 700 16px var(--ui); letter-spacing: 0; text-shadow: none; box-shadow: none; }
#setup #startbtn { background: var(--verm); border: 1px solid #e9c98a; color: #fff3dc; }
#diffs button .lk .ico.lock, #mutlv .lk .ico.lock { width: 14px; height: 14px; margin-right: 3px; vertical-align: -2px; }
/* 방: 들어온 뒤에는 겹친 제목·코드 입력 줄을 숨기고 여백을 줄여 참가자 카드가 한 화면에 */
#setup.inroom #netbox > .label, #setup.inroom #netbox > .inline { display: none; }
#setup.inroom .wz { padding-top: 6px; padding-bottom: 6px; gap: 6px; }
#setup.inroom #netbox { padding: 6px 8px; }
#setup.inroom #lobby { margin-top: 0; padding: 6px 8px; }
#setup #lbcode { font-weight: 800; font-size: 24px; letter-spacing: .18em !important; color: var(--gold-hi); font-variant-numeric: tabular-nums; }
.lb-slot { min-height: 70px; padding: 6px 4px 5px; border-radius: var(--r-m); }
.lb-slot .av { width: 34px; height: 34px; border-radius: 50%; object-fit: cover; object-position: top; background: #2a1d14; border: 1px solid rgba(201,164,92,.6); }
.lb-slot.me { border-color: var(--gold-hi); box-shadow: 0 0 0 1px var(--gold-hi), 0 0 10px rgba(255,216,106,.3); }
#setup.inroom #chatlog { height: 72px; }

/* ---- 결과 화면: 머리·본문은 스크롤, 버튼은 고정 바닥 줄(통계를 가리지 않음). 창과 카드가 차례로 나타난다 ---- */
#end .sheet.es { overflow: hidden; display: flex; flex-direction: column; gap: 0; animation: winIn .22s ease-out; }
#end .sheet.es > .es-body, #end .sheet.es > .es-foot { margin-left: 0; margin-right: 0; }
#end .es-body { flex: 1 1 auto; min-height: 0; overflow-y: auto; display: flex; flex-direction: column; gap: 8px; padding: 0 16px 10px; }
#end .es-foot { flex: none; display: flex; justify-content: center; gap: 12px; padding: 8px 16px 6px; border-top: 1px solid rgba(201,164,92,.3); }
#end .es-foot .btn { position: static; min-width: 170px; height: auto; min-height: 46px; margin: 0; padding: 0 22px; border: 1px solid var(--gold-line); border-image: none; border-radius: var(--r-m); background: rgba(20,12,8,.78); color: #efe4cc; font: 700 16px var(--ui); letter-spacing: 0; text-shadow: none; filter: none; }
#end .es-foot .btn.go { background: var(--verm); border-color: #e9c98a; color: #fff3dc; }
#end .es-lost { margin-top: -4px; text-align: center; font-weight: 700; font-size: 13.5px; color: #ffb39a; }
#end .es-cards .es-card { background: url(gfx/ui_paper.jpg) center / 260px; animation: esCard .3s ease-out backwards; }
#end .es-card.es-rw b { color: var(--verm); }
#end .es-card .ico { width: 15px; height: 15px; vertical-align: -3px; margin-right: 2px; }
#end .es-cards .es-card:nth-child(2) { animation-delay: .04s; } #end .es-cards .es-card:nth-child(3) { animation-delay: .08s; } #end .es-cards .es-card:nth-child(4) { animation-delay: .12s; }
#end .es-cards .es-card:nth-child(5) { animation-delay: .16s; } #end .es-cards .es-card:nth-child(6) { animation-delay: .2s; } #end .es-cards .es-card:nth-child(7) { animation-delay: .24s; }
#end .es-cards .es-card:nth-child(8) { animation-delay: .28s; } #end .es-cards .es-card:nth-child(9) { animation-delay: .32s; } #end .es-cards .es-card:nth-child(n+10) { animation-delay: .36s; }
@keyframes esCard { from { opacity: 0; transform: translateY(8px); } }

/* ---- 게임 안(CSS만): 알림 줄 · 첫 힌트 · HUD 칸 · 선택 창 · 서랍 · 보스전 버튼 · 조이스틱 ---- */

.hs small { white-space: nowrap; }

.mt-slot:not(.rdy) .mt-emb { filter: saturate(.6) brightness(.8); transition: filter .3s; }

<div id="boot">
  <div class="boot-brand logo"><div class="seal">天下</div><h1 id="boottitle"></h1></div>
  <div class="boot-card" id="bootcard" hidden></div>
  <div class="boot-load" id="bootload"><div class="boot-bar"><i id="bootfill"></i></div><div id="bootmsg"></div></div>
</div>

<div id="title">
  <canvas id="herocv"></canvas>
  <div id="ldim"></div>
  <!-- 로비 캐릭터: 지금은 일러스트에 숨쉬기·살랑임·터치 반응. 나중에 Live2D 모델로 이 자리를 바꾼다 -->
  <div id="lchar"><canvas id="lcharcv"></canvas><div id="lsay" hidden></div></div>
  <header id="ltop">
    <button id="lprof" type="button" data-lp="account"><img id="lico" alt=""><span><b id="lnick"></b><small id="lrank"></small></span></button>
    <div id="lcur"><span class="cur coin"><i class="ico coin" aria-hidden="true"></i><b id="lcoins">0</b></span><span class="cur gem"><i>寶</i><b id="lgems">0</b></span></div>
    <select id="langsel" aria-label="Language" hidden></select>
    <button id="lnews" type="button" data-lp="news" aria-label="Update notes" data-i18n-aria="newsLbl"><i class="ico news" aria-hidden="true"></i><b class="dot" hidden></b></button>
    <button id="lgear" type="button" data-lp="settings" aria-label="Settings" data-i18n-aria="settingsLbl"><i class="ico gear" aria-hidden="true"></i></button>
  </header>
  <div id="lbrand" class="logo"><div class="seal">天下</div><h1 id="gametitle">삼국 랜덤 디펜스</h1></div>
  <nav id="lmenu">
    <button type="button" data-lp="shop"><i>市</i><span data-i18n="lb_shop"></span></button>
    <button type="button" data-lp="rank"><i>榜</i><span data-i18n="lb_rank"></span></button>
    <button type="button" data-lp="history"><i>戰</i><span data-i18n="lb_history"></span></button>
    <button type="button" data-lp="mission"><i></i><span data-i18n="lb_mission"></span><b class="dot" hidden></b></button>
  </nav>
  <button id="lchatbar" type="button" data-lp="lchat" hidden></button>
  <div id="lplay"><button class="btn" id="contbtn" type="button" hidden></button><button class="btn go" id="battlebtn" type="button"><span data-i18n="lb_battle"></span></button></div>
  <div id="lpanel" hidden><div class="lp-box"><div class="lp-head"><b id="lptitle"></b><button type="button" id="lpclose" aria-label="閉じる" data-i18n-aria="close"><i class="ico close" aria-hidden="true"></i></button></div><div id="lptabs"></div><div id="lpbody"></div></div></div>
  <div id="lhold" hidden><div class="sec" id="accbox"></div></div>
  <!-- 전투 시작: 온라인/싱글 → 모드 → 난이도(방이면 방에서) → 시작 -->
  <section id="setup" hidden>
    <div class="wz-box">
      <div class="wz-head"><button type="button" id="wzback" aria-label="戻る" data-i18n-aria="back"><i class="ico back" aria-hidden="true"></i></button><b id="wztitle"></b><span id="wzsteps"></span><button type="button" id="wzclose" aria-label="閉じる" data-i18n-aria="close"><i class="ico close" aria-hidden="true"></i></button></div>
      <div class="wz" data-step="play"><div class="choice two playmode" id="playmode"></div><div class="hint2" id="playhint"></div><div class="hint2 wzgate" id="wzgate" hidden></div></div>
      <div class="wz" data-step="mode">
        <div class="sec" id="modesec"><div class="choice two modes" id="modes"></div></div>
        <div class="sec" id="aibox" hidden><div class="label"><span data-i18n="aiCount"></span> <span class="hint" data-i18n="aiCountHint"></span></div><div class="choice four" id="aicount"></div></div>
      </div>
      <div class="wz" data-step="diff" id="wzdiff">
        <div class="sec" id="diffsec"><div class="label" data-i18n="difficulty"></div><div class="choice diffs" id="diffs"></div></div>
        <div class="sec" id="mutbox" hidden>
          <div class="label"><span data-i18n="mutTitle"></span> <span class="hint" data-i18n="mutHint"></span></div>
          <div class="mutlv" id="mutlv"></div>
          <div id="mutrules"></div>
        </div>
      </div>
      <div class="wz" data-step="match"><div id="matchbox"></div></div>
      <div class="wz" data-step="room">
        <div class="sec" id="netbox" hidden>
          <div class="label"><span data-i18n="room"></span> <span class="hint" data-i18n="roomHint"></span></div>
          <div class="inline"><input id="code" maxlength="6" data-i18n-ph="roomCode" aria-label="room code"><button class="btn" id="jn" type="button" data-i18n="joinRoom"></button><button class="btn" id="mk" type="button" data-i18n="makeRoom"></button></div>
          <div id="lobby" hidden>
            <div class="lb-head"><div class="lb-code"><span data-i18n="roomCode"></span><b id="lbcode"></b><button class="btn" id="lbcopy" type="button" data-i18n="copy"></button></div><i id="lbnet"></i><button class="btn" id="lbleave" type="button" data-i18n="roomLeave"></button></div>
            <div class="lb-slots" id="lbslots"></div>
            <div class="lb-cfg" id="lbcfg"></div>
            <div id="wzroomdiff"></div>
            <div id="chat"><div id="chatlog"></div><div class="inline"><input id="chatin" maxlength="80" data-i18n-ph="lb_chatPh"><button class="btn" id="chatsend" type="button" data-i18n="lb_send"></button></div></div>
          </div>
          <div id="roster"></div>
        </div>
      </div>
      <div class="wz-foot"><button class="btn go" id="wznext" type="button" data-i18n="tut_next"></button><button class="btn go" id="startbtn" type="button"></button></div>
    </div>
  </section>
</div>
