<style>
/* 레이아웃: 고정 군막 화면. 왼쪽 타이머·명령, 가운데 게임판·정보·조합식, 오른쪽 탭. 패널은 스크롤 없이 한 화면에 들어온다. */
:root {

}
* { box-sizing: border-box; }
html, body { height: 100%; overflow: hidden; }
body { background: var(--ink); color: var(--paper); font: 13px/1.45 var(--ui); user-select: none; -webkit-user-select: none; overscroll-behavior: none; }
button, input { font: inherit; color: inherit; }
button { cursor: pointer; }
:focus-visible { outline: 2px solid var(--brass); outline-offset: 1px; }
#app { position: fixed; inset: env(safe-area-inset-top, 0px) 0 env(safe-area-inset-bottom, 0px) 0; display: grid; grid-template: 0 minmax(0, 1fr) 0 196px / 250px minmax(0, 1fr) 270px; padding-left: env(safe-area-inset-left, 0px); padding-right: env(safe-area-inset-right, 0px); }

#top b { font-family: var(--display); font-weight: 400; font-size: 17px; color: var(--brass); }
.stat { display: flex; gap: 5px; align-items: baseline; }

.stat strong { font-size: 14px; }
.stat.alert strong { color: var(--bad); }
#midclock { display: flex; align-items: center; gap: 8px; padding: 2px 8px; border: 1px solid var(--line); background: #33261c; }
#midclock.urgent { border-color: var(--warn); color: var(--warn); }
#stage { grid-row: 2; grid-column: 2; position: relative; background: #0d0a08; display: flex; align-items: center; justify-content: center; min-width: 0; min-height: 0; overflow: hidden; }

.td { max-height: 0; overflow: hidden; transition: max-height .22s ease; background: #241a14; }

#end .es-mutpop { position: fixed; z-index: 70; left: 50%; top: 50%; transform: translate(-50%, -50%); width: min(420px, 90vw); max-height: 80vh; overflow-y: auto; display: grid; gap: 4px; padding: 12px; background: #1d120c; border: 2px solid #ff5a5a; border-radius: 10px; box-shadow: 0 10px 30px rgba(0,0,0,.7); }

#end .es-cards .es-card { border: 1px solid #a8742a; border-radius: 8px; background: linear-gradient(180deg, #3a1d18 0%, #22100d 100%); box-shadow: inset 0 1px 0 rgba(255,220,180,.10), 0 2px 6px rgba(0,0,0,.5); }

/* ---- 판 끝 경험치 연출 ---- */
.over.xpwait { background: rgba(8, 5, 3, .55); backdrop-filter: blur(4px); -webkit-backdrop-filter: blur(4px); }
#xpfx { position: absolute; inset: 0; z-index: 60; display: flex; align-items: center; justify-content: center; background: rgba(6, 4, 2, .62); backdrop-filter: blur(6px); -webkit-backdrop-filter: blur(6px); opacity: 0; transition: opacity .5s; pointer-events: none; }
#xpfx.in { opacity: 1; } #xpfx.out { opacity: 0; }
#xpfx .xpbox { display: grid; grid-template-columns: 110px minmax(0, 1fr) 110px; align-items: center; gap: 14px; width: min(720px, 92%); }
#xpfx .xpside { display: flex; flex-direction: column; align-items: center; gap: 4px; color: #e8dcc0; font: 700 13px var(--ui); text-shadow: 0 1px 2px #000; }
#xpfx .xpm { width: 84px; height: 84px; display: flex; align-items: center; justify-content: center; }
#xpfx .xpm img { max-width: 100%; max-height: 100%; filter: drop-shadow(0 4px 8px rgba(0,0,0,.7)); }
#xpfx .xpm b { font: 400 34px "Black Han Sans", sans-serif; color: #ffd86a; }
#xpfx .r .xpm { opacity: .55; filter: grayscale(.6); }
#xpfx.up .l .xpm { animation: xpup .6s ease-out; }
@keyframes xpup { 0% { transform: scale(1.6); filter: brightness(2.2); } 100% { transform: scale(1); filter: none; } }
#xpfx .xpmid { position: relative; display: flex; flex-direction: column; align-items: center; gap: 6px; }
#xpfx .xpbar { width: 100%; height: 22px; border-style: solid; border-width: 6px 8px; border-image: url(gfx/ui_menu.png) 12 fill stretch; position: relative; }
#xpfx .xpbar i { position: absolute; left: 0; top: 0; bottom: 0; width: 0; background: linear-gradient(180deg, #ffe08a, #d89a2a 60%, #a8661a); box-shadow: 0 0 10px rgba(255,190,80,.7); border-radius: 2px; }
#xpfx .xpnum { font: 700 12px var(--ui); color: #d8cbb0; font-variant-numeric: tabular-nums; }
#xpfx .xpgain { position: absolute; top: -46px; font: 400 32px "Black Han Sans", sans-serif; color: #ffe08a; text-shadow: 0 2px 4px #000, 0 0 14px rgba(255,190,80,.8); opacity: 0; transform: translateY(10px) scale(.8); transition: opacity .35s, transform .35s; }
#xpfx .xpcoin { font: 700 15px var(--ui); color: #ffd86a; opacity: 0; transition: opacity .35s .2s; }
#xpfx.gain .xpgain { opacity: 1; transform: none; } #xpfx.gain .xpcoin { opacity: 1; }
.es-card small { color: var(--dim); font-size: 11px; }
.es-card b { font: 400 20px "Black Han Sans", sans-serif; color: #f4ecd8; }
.es-card i { font-style: normal; font-size: 11px; color: var(--dim); }
.es-boss { width: 100%; border-collapse: collapse; font-size: 12px; }
.es-boss th { text-align: left; color: var(--dim); font-weight: 500; padding: 3px 6px; }
.es-boss td { padding: 4px 6px; border-top: 1px solid var(--line); vertical-align: top; }
.es-boss td.ok { color: #9be89a; } .es-boss td.bad { color: #ff7a60; }
.es-rks { display: flex; flex-wrap: wrap; gap: 3px 10px; }
.es-rk em { font-style: normal; color: var(--dim); } .es-rk.me { color: #9be89a; }
.es-bar { display: grid; grid-template-columns: 170px 1fr 150px; align-items: center; gap: 8px; font-size: 12px; margin: 2px 0; }
.es-bar .b { height: 10px; background: rgba(255,255,255,.06); } .es-bar .b i { display: block; height: 100%; }
.es-bar .v { text-align: right; color: var(--dim); }
@media (max-width: 640px) { .es-bar { grid-template-columns: 110px 1fr 100px; } .es-boss td:nth-child(4) { display: none; } }
/* 세로로 긴 화면만 쌓아서 보여준다. 나머지 해상도는 ui.js가 화면 전체 배율로 맞춘다. */
@media (max-width: 900px) and (orientation: portrait) {
  #title { grid-template-columns: minmax(0, 1fr); }
  #setup { padding-left: max(16px, env(safe-area-inset-left, 0px)); justify-content: flex-start; }
  .choice { grid-template-columns: repeat(2, 1fr); }
}
@media (prefers-reduced-motion: reduce) { .toast { animation-duration: 3.6s; } #hired img { animation: none; } }
/* ===== 모바일 우선 배치: 맵을 화면 전체로, 패널은 서랍·게임 내 버튼으로 ===== */
#app { display: block; grid-template: none; padding: 0; inset: 0; }
#stage { position: absolute; inset: 0; grid-row: auto; grid-column: auto; }
:root { --sl: max(8px, env(safe-area-inset-left, 0px)); --sr: max(8px, env(safe-area-inset-right, 0px)); --st: max(6px, env(safe-area-inset-top, 0px)); --sb: max(6px, env(safe-area-inset-bottom, 0px)); }
.glass { background: rgba(16, 11, 8, .84); border: 1px solid rgba(205, 167, 91, .55); }
/* 위쪽 정보 줄 */
#hud { position: absolute; top: var(--st); left: var(--sl); z-index: 4; display: flex; flex-direction: column; gap: 4px; pointer-events: none; max-width: calc(100% - 140px); }
#hud .hrow { display: flex; flex-direction: column; gap: 3px; }
.hs { background: rgba(16, 11, 8, .8); border: 1px solid rgba(205, 167, 91, .5); border-radius: 8px; padding: 2px 8px; display: flex; align-items: baseline; justify-content: space-between; gap: 8px; width: 118px; font-variant-numeric: tabular-nums; }
.hs small { font-size: 10px; color: var(--dim); line-height: 1.25; }
.hs b { font: 400 16px/1.1 "Black Han Sans", sans-serif; color: #f4ecd8; }
.hs.gold b { color: #ffd86a; } .hs.alert { border-color: #ff7a60; } .hs.alert b { color: #ff7a60; }
.nc { pointer-events: auto; cursor: pointer; width: 118px; background: rgba(16, 11, 8, .8); border: 1px solid var(--line); border-radius: 8px; padding: 3px 8px; font-size: 11px; line-height: 1.35; color: #f4ecd8; }
/* 유닛 능력치: 버프로 오른 값은 연한 빨강 굵게, 내린 값은 파랑 굵게. 상세를 누르면 출처가 가로로 펼쳐진다 */
.bup { color: #ff8f80 !important; font-weight: 800; }
.bdn { color: #6fb0ff !important; font-weight: 800; }
.sdbtn { font-size: 10px; padding: 0 6px; min-height: 18px; margin-left: 4px; border-radius: 6px; background: rgba(255,255,255,.08); border: 1px solid var(--line); color: var(--dim); vertical-align: middle; }
.sdet { display: flex; flex-wrap: wrap; gap: 4px 10px; margin: 3px 0 4px; font-size: 11.5px; color: #d8cbb0; }
.sdet span { white-space: nowrap; }
#selbar:not(.exp) #info > .sdet { display: none; }
.sagerow { display: flex; align-items: center; gap: 8px; }
.sagerow > div { flex: 1; min-width: 0; }
.sagerow .spor { width: 40px; height: 40px; flex: none; border-radius: 8px; object-fit: cover; object-position: top; background: #1c140e; border: 1px solid var(--line); }
#hud .party { display: flex; flex-direction: column; gap: 3px; margin-top: 6px; }
#hud .pm { pointer-events: auto; display: grid; grid-template-columns: 26px minmax(0, 1fr); grid-template-rows: auto auto; column-gap: 5px; align-items: center; width: 118px; padding: 2px 5px 2px 2px; border-radius: 8px; background: rgba(16, 11, 8, .5); border: 1px solid rgba(205, 167, 91, .3); color: #f4ecd8; text-align: left; }
#hud .pm.on { border-color: #ffd86a; background: rgba(60, 40, 16, .6); }
#hud .pm.away { opacity: .5; }
#hud .pm .pi { grid-row: 1 / 3; width: 26px; height: 26px; border-radius: 50%; object-fit: cover; object-position: top; background: #1c140e; }
#hud .pm .pn { font-size: 11px; font-weight: 700; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; display: flex; align-items: center; gap: 2px; }
#hud .pm .rkm { width: 13px; height: 13px; flex: none; }
#hud .pm .ps { font-size: 9.5px; color: var(--dim); white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
.nc.boss { border-color: #f0b08a; } .nc.boss b { color: #f0b08a; } .nc.mid { border-color: var(--warn); color: var(--warn); }
/* 오른쪽 위: 배속·메뉴 */
#tr { position: absolute; top: var(--st); right: var(--sr); z-index: 4; display: flex; gap: 6px; }
.hb { min-width: 44px; height: 40px; padding: 0 10px; border-radius: 10px; background: rgba(16, 11, 8, .84); border: 1px solid rgba(205, 167, 91, .6); color: #f4ecd8; font: 700 14px var(--ui); display: inline-flex; align-items: center; justify-content: center; }
.hb[hidden] { display: none; }
.hb .ic, .rb .ic { width: 22px; height: 22px; fill: none; stroke: currentColor; stroke-width: 1.9; stroke-linecap: round; stroke-linejoin: round; }
#speedbtn { position: static; padding: 0 12px; }
/* 오른쪽 끝 버튼 열 */
#rail { position: absolute; right: var(--sr); top: 50%; transform: translateY(-50%); z-index: 4; display: flex; flex-direction: column; gap: 6px; }
#rail[hidden] { display: none; }
.rb { position: relative; width: 54px; height: 50px; border-radius: 12px; background: radial-gradient(circle at 50% 30%, #3a2a1c, #160f0a 80%); border: 1px solid rgba(205, 167, 91, .6); color: #f4ecd8; font: 700 10px/1.1 var(--ui); display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 2px; padding: 0; box-shadow: 0 2px 6px rgba(0, 0, 0, .45); }
.rb.on { border-color: #7dff8e; color: #b8ffc0; box-shadow: 0 0 10px rgba(125, 255, 142, .45); }
.rb.cur { background: radial-gradient(circle at 50% 30%, #6a4a24, #2a1a0e 80%); }
.rb .dot { position: absolute; top: -5px; right: -5px; min-width: 18px; padding: 0 4px; font: 700 11px/18px var(--ui); border-radius: 9px; background: var(--cinnabar); color: #fff; }
.rb .sub2 { font-size: 9px; color: #ffd86a; }
/* 아래 선택 막대: 유닛을 골랐을 때만 */
#selbar { position: absolute; left: 50%; transform: translateX(-50%); bottom: var(--sb); width: min(780px, calc(100% - 150px)); z-index: 4; display: grid; grid-template-columns: minmax(0, 1fr) auto; grid-template-rows: auto auto; gap: 4px 8px; padding: 6px 8px; border-radius: 12px; background: rgba(20, 14, 10, .92); border: 1px solid rgba(205, 167, 91, .6); box-shadow: 0 4px 16px rgba(0, 0, 0, .5); }
#selbar[hidden] { display: none; }
#selbar #info { grid-column: 1; grid-row: 1; padding: 0; max-height: 50px; overflow: hidden; cursor: pointer; }
#selbar #info .por { width: 44px; height: 44px; margin-right: 6px; }
#selbar #info h3 { font-size: 17px; line-height: 22px; }
#selbar:not(.exp) #info > :not(.por):not(h3):not(.sub):not(.chips) { display: none; }
/* 여러 기를 고르면 무엇을 골랐는지 접힌 상태에서도 한 줄로 보이게(옆으로 밀어 봄) */
#selbar:not(.exp) #info > .chips { flex-wrap: nowrap; overflow-x: auto; margin-top: 2px; scrollbar-width: none; }
#selbar #info > .chips .chip { white-space: nowrap; flex: none; }
#selbar.exp #info { max-height: 42vh; overflow-y: auto; }
#selbar #recipes { grid-column: 1; grid-row: 2; padding: 0; border: 0; max-height: 56px; overflow: hidden; }
#selbar.exp #recipes { max-height: 30vh; overflow-y: auto; }
#selbar #cmds { grid-column: 2; grid-row: 1 / 3; display: flex; flex-wrap: wrap; gap: 4px; align-content: center; max-width: 300px; background: none; border: 0; padding: 0; }
#selbar .cmd { width: 46px; height: 46px; border-radius: 10px; }
#selbar .cmd.empty { display: none; }
#selbar.boss { width: auto; max-width: calc(100% - 340px); left: var(--sl); transform: none; padding: 4px 6px; background: rgba(20, 14, 10, .72); }
#selbar.boss:not(.exp) #info { display: none; }
#selbar.boss #recipes { max-height: none; }
#selbar.boss:not(.exp) #recipes > .line { display: none; }
#selbar.boss .mini .btn { min-height: 34px; padding: 2px 10px; font-size: 12px; }
#selbar.boss #cmds { display: none; }
#selbar .hint { color: var(--dim); font-size: 11px; }
/* 서랍 */
#drawer { position: fixed; top: 0; bottom: 0; right: 0; width: min(380px, 52vw); z-index: 40; display: flex; flex-direction: column; background: var(--lacquer); border-left: 1px solid var(--line); box-shadow: -10px 0 30px rgba(0, 0, 0, .55); padding: env(safe-area-inset-top, 0px) env(safe-area-inset-right, 0px) env(safe-area-inset-bottom, 0px) 0; animation: drawin .16s ease-out; }
#drawer[hidden] { display: none; }
@keyframes drawin { from { transform: translateX(40px); opacity: .4; } to { transform: none; opacity: 1; } }
#dhead { display: flex; border-bottom: 1px solid var(--line); }
#drawer #tabs { flex: 1; display: flex; overflow-x: auto; border: 0; grid-template-columns: none; }
#drawer #tabs button { flex: 1 0 auto; padding: 11px 9px; font-size: 13px; }
#dclose { flex: none; width: 46px; background: none; border: 0; border-left: 1px solid var(--line); color: var(--paper); font-size: 18px; }
#drawer #pane { flex: 1; }
#drawer #pane[hidden] { display: none; }
#drawer #timers { flex: 1; overflow-y: auto; border: 0; grid-row: auto; grid-column: auto; }
#drawer #timers[hidden] { display: none; }

  background: radial-gradient(circle at 50% 40%, color-mix(in srgb, var(--c) 30%, transparent) 0%, rgba(12, 8, 5, .28) 75%); border: 2px solid color-mix(in srgb, var(--c) 75%, transparent);

/* 버튼 위 흐림·그림자 필터는 쓰지 않는다: 매 프레임 바뀌는 전장 위에 얹히면 휴대폰에서 프레임이 크게 떨어진다 */

#netbox[data-room="join"] #mk { display: none; } #netbox[data-room="create"] #code, #netbox[data-room="create"] #jn { display: none; }
